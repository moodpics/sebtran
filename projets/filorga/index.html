<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#000000">
<title>Filorga — 4 campagnes · 19+20 nov. 2026</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0c0c;--mute:#7b7b7b;--line:#e4e4e4;--soft:#f5f5f5;--sans:"Hanken Grotesk",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:400 14px/1.45 var(--sans);color:var(--ink);background:#000;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}

/* ---- barre du haut ---- */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 18px;background:linear-gradient(#000 60%,rgba(0,0,0,0));color:#fff}
.bar b{font-weight:600;letter-spacing:-.01em;font-size:15px;margin-right:auto;white-space:nowrap}
.bar small{color:#9a9a9a;font-size:12px;margin-right:6px}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:70vw}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;padding:5px 13px;font-size:13px;transition:.15s}
.pill:hover{border-color:#fff}
.pill.on{background:#fff;color:#000;border-color:#fff}

/* ---- canvas ---- */
#view{position:fixed;inset:0;overflow:auto;background:linear-gradient(180deg,#000 0%,#000 5%,#7d7d7d 42%,#e9e9e9 74%,#fff 100%) local}
#stage{position:relative;margin:0 auto}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.node{position:absolute;background:#fff;border:1px solid rgba(0,0,0,.14);border-radius:4px;box-shadow:0 14px 34px -12px rgba(0,0,0,.45)}
.node.drag{box-shadow:0 24px 50px -12px rgba(0,0,0,.6);z-index:5}
.node.me{box-shadow:0 0 0 3px #000,0 0 0 5px #fff,0 14px 34px -12px rgba(0,0,0,.45)}
.nh{display:flex;justify-content:space-between;align-items:center;padding:9px 14px 8px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);cursor:grab;user-select:none;touch-action:none}
.nh i{font-style:normal;letter-spacing:0;text-transform:none;font-size:12px}
.nb{padding:14px}
.node h3{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.node h2{margin:0;font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.05}
.node p{margin:0 0 8px;color:#3d3d3d}
.sub{color:var(--mute);font-size:13px}
.node ul{list-style:none;margin:0;padding:0}
.node li{padding:7px 0;border-top:1px solid var(--line)}
.node li:first-child{border-top:0}

/* hero */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:16px}
.facts span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.facts b{font-weight:500;font-size:14px}
.facts.crew{grid-template-columns:repeat(3,1fr);gap:16px 20px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.facts.crew b{font-size:15px}
body.m .facts.crew{grid-template-columns:1fr 1fr}
.cd{display:flex;align-items:baseline;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.cd strong{font-size:34px;font-weight:500;letter-spacing:-.03em}

/* campagnes */
.band{height:84px;margin:-14px -14px 12px;border-bottom:1px solid var(--line)}
.tag{display:inline-block;border:1px solid #cfcfcf;border-radius:99px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
.tag.k{background:#000;color:#fff;border-color:#000}
textarea,select,input[type=text]{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:3px;padding:8px 10px}
textarea{min-height:64px;resize:vertical;line-height:1.45}
textarea:focus,select:focus,input:focus{outline:2px solid #000;outline-offset:-1px;background:#fff}

/* images de référence */
.rimg{display:block;width:100%;height:auto;border-radius:3px;margin-top:10px;border:1px solid var(--line);cursor:zoom-in;background:#000}
.refs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.refs img{width:100%;height:112px;object-fit:cover;border-radius:3px;border:1px solid var(--line);cursor:zoom-in;display:block}
.refs.three{grid-template-columns:1fr 1fr 1fr}
.refs.three img{height:120px}
.node p.v{color:var(--ink)}
.node ul.v>li,.node ol.v>li{padding:9px 0}
.node ol.v{padding-left:18px;margin:0}
.node ol.v>li{border-top:1px solid var(--line)}
.node ul.s{margin:6px 0 0;padding-left:16px;list-style:disc}
.node ul.s li{border:0;padding:2px 0}
#lb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 20px 80px rgba(0,0,0,.6)}
/* fonds */
.sw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw div{height:74px;border:1px solid var(--line);border-radius:3px;display:flex;align-items:flex-end;padding:7px;font-size:12px}
.sw div span{background:rgba(255,255,255,.88);padding:1px 6px;border-radius:2px}
.sw .dark span{background:rgba(0,0,0,.6);color:#fff}

/* planning */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slots label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}

/* hub / départements */
.hub .nb{padding:12px 16px;text-align:center}
.hub h3{font-size:17px;margin:0}
.dept{cursor:pointer}
.dept:hover{box-shadow:0 18px 40px -12px rgba(0,0,0,.55)}
.bardone{height:4px;background:var(--line);border-radius:2px;margin:10px 0 12px;overflow:hidden}
.bardone i{display:block;height:100%;background:#000}
.dept li{font-size:13px;color:#3d3d3d}
.open{display:inline-block;margin-top:10px;font-size:13px;font-weight:500;border-bottom:1px solid #000}

/* équipe / questions */
.team{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.team li{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.team li span{color:var(--mute)}
.team li.tbc b{color:#aaa;font-weight:400;font-style:italic}
.ql li{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:13px}
.ql li:hover{background:var(--soft)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:#000;margin-top:6px}
.dot.ok{background:transparent;border:1.5px solid #9a9a9a}

/* boutons */
.btn{display:inline-block;border:1px solid #000;border-radius:3px;padding:7px 13px;font-size:13px;font-weight:500;background:#fff;cursor:pointer}
.btn:hover{background:#000;color:#fff}
.btn.p{background:#000;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* zoom */
.zoom{position:fixed;left:18px;bottom:18px;z-index:30;display:flex;background:#fff;border:1px solid rgba(0,0,0,.2);border-radius:4px;box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
.zoom button{padding:8px 13px;font-size:14px;border-right:1px solid var(--line)}
.zoom button:last-child{border:0;font-size:12px}
.zoom button:hover{background:var(--soft)}

/* tiroir */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:.2s}
#shade.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);background:#fff;z-index:41;transform:translateX(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.35)}
#drawer.on{transform:none}
.dh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.dh h2{font-size:26px;font-weight:500;letter-spacing:-.025em;margin:0}
.dh button{font-size:26px;line-height:1;padding:2px 8px}
.ds{padding:20px 22px;border-bottom:1px solid var(--line)}
.ds ul{list-style:none;margin:0;padding:0}
.ds h4{margin:0 0 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:500}
.ds li{padding:8px 0 8px 16px;border-top:1px solid var(--line);position:relative}
.ds li:first-child{border-top:0}
.det.bl>span{display:block;position:relative;padding-left:14px}
.det.bl>span:not(.ed)::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:#000}
.det.bl>span.ed{padding-left:0;min-width:240px}
.notebox{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:12px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;min-height:64px}
.notebox .ed{display:block;min-height:40px}
.ds .kn li::before{content:"";position:absolute;left:0;top:15px;width:6px;height:6px;border-radius:50%;background:#000}
.ds .kn li.w::before{background:transparent;border:1.5px solid #000}
.ds small{display:block;color:var(--mute)}
.ck li{display:flex;gap:11px;align-items:flex-start;padding-left:0}
.ck .mk-l{cursor:pointer;display:flex;flex:none;margin-top:5px}
.ck i.mk{flex:none;width:11px;height:11px;border-radius:50%;border:1.5px solid #b5b5b5;margin-top:5px;box-sizing:border-box}
.ck .mk-l i.mk{margin-top:0}
.ck i.mk.on{background:#000;border-color:#000}
.ck li.off .t{color:#9a9a9a;font-weight:400}
.ck .t{font-weight:500}
.det{display:block;margin-top:4px;font-size:13px;color:#555}
.det>span{display:block;padding:2px 0}
.det em{font-style:normal;color:var(--mute)}
.ck .x{margin-left:auto;color:#9a9a9a;font-size:18px;line-height:1}
.ck .x:hover{color:#000}
.pis{font-size:12px;border:1px solid #cfcfcf;border-radius:99px;padding:0 8px;margin-left:6px;color:#555}
.add{display:flex;gap:8px;margin-top:12px}
.q{border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:10px}
.q.done{opacity:.55}
.q header{display:flex;justify-content:space-between;gap:12px}
.q h5{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.st{flex:none;border:1px solid #000;border-radius:99px;padding:2px 11px;font-size:12px;height:fit-content}
.st.r{background:#000;color:#fff}
.q .tags{margin:8px 0}
.q textarea{min-height:56px}
.fl{display:flex;gap:6px;flex-wrap:wrap}
.fl button{border:1px solid #cfcfcf;border-radius:99px;padding:3px 11px;font-size:12px}
.fl button.on{background:#000;color:#fff;border-color:#000}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);background:#fff;color:#000;padding:9px 16px;border-radius:3px;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:.2s;pointer-events:none;z-index:60;font-size:13px}
.toast.on{opacity:1;transform:translateX(-50%)}

/* mobile : colonne simple, plus de câbles */
body.m{background:linear-gradient(#000 0,#000 3%,#777 35%,#e8e8e8 70%,#fff 100%) fixed}
body.m #view{position:static;overflow:visible;padding:64px 14px 90px}
body.m #stage{width:auto!important;height:auto!important;background:none}
body.m #world{position:static;transform:none!important}
body.m #edges{display:none}
body.m .node{position:static;width:auto!important;margin:0 0 14px}
body.m .nh{cursor:default}
body.m .zoom{display:none}
body.m .pills{max-width:62vw}
body.m .bar small{display:none}

/* lecture seule / édition */
.slots b{font-weight:500}.slots b.tbc{color:#9a9a9a;font-weight:400;font-style:italic}
.node h2.pl{white-space:pre-line;font-size:84px;line-height:1;letter-spacing:-.035em;font-weight:600;margin:22px 0 12px}
#n_root .sub{font-size:18px}
.team .rt{display:inline-flex;align-items:center}
.q .ans{margin-top:8px;padding:10px 12px;background:var(--soft);border-radius:3px;white-space:pre-wrap}
.rw{position:relative}
.ed{outline:none;border-radius:2px;min-width:2ch}
.ed:empty::before{content:attr(data-ph);color:#aaa;font-weight:400}
body.edit .ed{box-shadow:inset 0 -1px 0 rgba(0,0,0,.28)}
body.edit .ed:hover{background:rgba(0,0,0,.05)}
body.edit .ed:focus{background:#fff;box-shadow:0 0 0 2px #000}
.xdel{color:#999;font-size:17px;line-height:1;margin-left:6px;padding:0 4px;vertical-align:middle}
.xdel:hover{color:#000}
.rw .xdel{position:absolute;top:4px;right:4px;background:#fff;border-radius:99px;width:20px;height:20px;padding:0;margin:0;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.xadd{display:inline-block;font-size:12px;border:1px dashed #8a8a8a;border-radius:99px;padding:2px 11px;margin:8px 6px 0 0;color:#333;background:#fff}
.xadd:hover{border-style:solid;border-color:#000}
.wk{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--mute);margin-top:2px}
.dt{width:auto;margin-left:auto;padding:3px 6px;font-size:12px}
#ebar{display:flex;align-items:center;gap:8px;margin-left:12px}
#ebar .elab{border:1px solid #fff;border-radius:99px;padding:3px 11px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
#estat{font-size:12px;color:#bbb;white-space:nowrap}
#ebar .btn{padding:5px 12px;border-color:#fff;background:transparent;color:#fff}
#ebar .btn.p{background:#fff;color:#000}
#ebar .btn:disabled{opacity:.35;cursor:default}
#ebar .btn:not(:disabled):hover{background:#fff;color:#000}
body.edit .nh{cursor:grab}body:not(.edit) .nh{cursor:default}
body.edit .pills{max-width:42vw}

</style>
</head>
<body>

<div class="bar">
  <b>Filorga</b><small id="stamp"></small><small>Je suis…</small>
  <div class="pills" id="pills"></div>
</div>

<div id="view"><div id="stage"><div id="world"><svg id="edges"></svg></div></div></div>

<div class="zoom" id="zoom"><button data-z="-" aria-label="Dézoomer">−</button><button data-z="+" aria-label="Zoomer">+</button><button data-z="fit">Ajuster</button><button data-z="reset">Remettre en place</button></div>

<div id="shade"></div>
<aside id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast"></div>
<div id="lb"><img alt=""></div>

<script>
/* =========== Configuration =========== */
const REPO={owner:"moodpics",repo:"sebtran",dir:"projets/filorga",branch:"main"};
const TOKEN_KEY="filorga-gh-token",DRAFT_KEY="filorga-draft-v1",VIEW_KEY="filorga-view-v1";
const API=`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${REPO.dir}`;
const EDIT_REQ=location.hash==="#edit";
let EDIT=false,TOKEN="",DATA=null,PENDING={},dirty=false,serverStamp="";
let V={role:"",z:0};try{V=Object.assign(V,JSON.parse(localStorage.getItem(VIEW_KEY)||"{}"))}catch(e){}
const saveView=()=>{try{localStorage.setItem(VIEW_KEY,JSON.stringify(V))}catch(e){}};

/* =========== Utilitaires =========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),m.length>70?9000:2600)};
const get=p=>p.split(".").reduce((o,k)=>o==null?o:o[k],DATA);
const set=(p,v)=>{const a=p.split("."),k=a.pop();a.reduce((o,x)=>o[x],DATA)[k]=v};
const imgSrc=s=>PENDING[s]?PENDING[s].url:s;
const mobile=()=>innerWidth<1000;
const uid=()=>Math.random().toString(36).slice(2,8);
const D=id=>DATA.depts.find(d=>d.id===id);
const di=id=>DATA.depts.findIndex(d=>d.id===id);
const isDone=t=>!!t.done||!!((t.lines&&t.lines.length)||(t.fix&&t.fix.length)||(t.ctl&&t.ctl.length));

/* champs éditables : en lecture seule ce sont de simples textes */
const ed=(p,tag,cls,txt,ph)=>EDIT?`<${tag} class="${cls||""} ed" contenteditable="true" spellcheck="false" data-p="${p}" data-ph="${esc(ph||"…")}">${esc(txt)}</${tag}>`:`<${tag} class="${cls||""}">${esc(txt)}</${tag}>`;
const edj=(p,tag,cls,arr,sep,ph)=>EDIT?`<${tag} class="${cls||""} ed" contenteditable="true" spellcheck="false" data-p="${p}" data-t="${sep==="\n"?"lines":"semi"}" data-ph="${esc(ph||"…")}">${esc((arr||[]).join(sep))}</${tag}>`:"";
const del=(p,i)=>EDIT?`<button class="xdel" data-del="${p}" data-i="${i}" title="Supprimer" aria-label="Supprimer">×</button>`:"";
const add=(p,tpl,label)=>EDIT?`<button class="xadd" data-add="${p}" data-tpl="${tpl}">+ ${esc(label)}</button>`:"";
const addimg=(p,label)=>EDIT?`<button class="xadd" data-addimg="${p}">+ ${esc(label||"image")}</button>`:"";
const setimg=(p,label)=>EDIT?`<button class="xadd" data-setimg="${p}">${esc(label||"Changer l'image")}</button>`:"";
const TPL={reco:()=>({t:""}),known:()=>({t:"",sub:"",w:0}),todo:()=>({t:"",done:0,lines:[],fix:[],ctl:[]}),ref:()=>({src:"",title:"Nouvelle référence",cap:"",link:"",linkText:""}),
 brief:()=>({t:"",b:0,sub:[],img:"",imgNote:""}),str:()=>"",team:()=>({role:"",name:""}),qs:()=>({id:"q"+uid(),t:"",d:[],done:0,answer:""})};
const imgs=(p,list,cls)=>`<div class="refs ${cls||""}">${list.map((i,n)=>`<div class="rw"><img data-zoom src="${esc(imgSrc(i.src))}" alt="${esc(i.alt||"")}" loading="lazy">${del(p,n)}</div>`).join("")}</div>${addimg(p)}`;

/* =========== Corps des nodes =========== */
const world=$("#world"),svg=$("#edges"),stage=$("#stage");
let NODES=[],EDGES=[];const el={};
function makeNodes(){
 NODES=[{id:"root",kind:"Projet",x:470,y:60,w:620},{id:"brief",kind:"Brief",x:90,y:70,w:350},{id:"mood",kind:"Light direction · General mood",x:1110,y:70,w:360},
  ...DATA.camps.map((c,i)=>({id:"c_"+c.id,kind:"Campagne 0"+(i+1),x:70+i*370,y:830,w:340,ci:i})),
  {id:"plan",kind:"Planning provisoire",x:215,y:1420,w:440},{id:"loc",kind:"Location",x:725,y:1420,w:620},
  {id:"hub",kind:"Chacun sa partie",x:650,y:1780,w:260,cls:"hub"},
  ...DATA.depts.map((d,i)=>({id:"d_"+d.id,kind:"Département",x:Math.round(780-(DATA.depts.length*330+(DATA.depts.length-1)*40)/2)+i*370,y:1920,w:330,cls:"dept",did:d.id})),
  {id:"team",kind:"Équipe",x:500,y:2400,w:560}];
 EDGES=[["root","brief"],["root","mood"],...DATA.camps.map(c=>["root","c_"+c.id]),...DATA.camps.map(c=>["c_"+c.id,"plan"]),["plan","hub"],...DATA.depts.map(d=>["hub","d_"+d.id])];
}
function body(n){
 if(n.id==="root"){const r=DATA.root;return `<h2 class="pl">${ed("root.title","span","",r.title)}</h2>
  ${ed("root.sub","p","sub",r.sub)}
  <div class="facts crew">${(r.crew||[]).map((f,i)=>`<div>${ed(`root.crew.${i}.0`,"span","",f[0])}${ed(`root.crew.${i}.1`,"b","",f[1])}</div>`).join("")}</div>`;}
 if(n.id==="brief"){const B=DATA.brief;return `<ul class="v">${B.items.map((it,i)=>`<li>${ed(`brief.items.${i}.t`,it.b?"b":"span","",it.t,"Point du brief")}
   ${(it.sub.length||EDIT)?`<ul class="s">${it.sub.map((s,j)=>`<li>${ed(`brief.items.${i}.sub.${j}`,"span","",s)}${del(`brief.items.${i}.sub`,j)}</li>`).join("")}</ul>${add(`brief.items.${i}.sub`,"str","sous-point")}`:""}
   ${it.img?`<img class="rimg" data-zoom src="${esc(imgSrc(it.img))}" alt="">${ed(`brief.items.${i}.imgNote`,"p","sub",it.imgNote,"Légende")}`:""}${setimg(`brief.items.${i}.img`,it.img?"Changer l'image":"+ image")}${del("brief.items",i)}</li>`).join("")}</ul>${add("brief.items","brief","point du brief")}
  ${ed("brief.source","p","sub",B.source)}`;}

  for(const [path,v] of Object.entries(PENDING)){
   if(!used.includes(path))continue;
   const r=await gh("/"+path,{method:"PUT",body:JSON.stringify({message:"Filorga : ajout image "+path,content:v.b64,branch:REPO.branch})});
   if(!r.ok)throw new Error("image "+r.status)}
  DATA.updated=new Date().toISOString();
  const cur=await gh(`/data.json?ref=${REPO.branch}`);if(!cur.ok)throw new Error("lecture "+cur.status);const cj=await cur.json(),sha=cj.sha;
  try{const rem=JSON.parse(decodeURIComponent(escape(atob(cj.content.replace(/\n/g,"")))));if(rem.updated&&serverStamp&&rem.updated!==serverStamp)throw new Error("conflit : le site a été modifié ailleurs depuis ton chargement. Clique « Annuler » pour recharger la dernière version, puis refais ta modif")}catch(e){if(/^conflit/.test(e.message))throw e}
  const put=await gh("/data.json",{method:"PUT",body:JSON.stringify({message:"Filorga : mise à jour du contenu",content:b64u(JSON.stringify(DATA,null,1)+"\n"),sha,branch:REPO.branch})});
  if(!put.ok)throw new Error("écriture "+put.status);
  serverStamp=DATA.updated;PENDING={};dirty=false;try{localStorage.removeItem(DRAFT_KEY)}catch(e){}
  toast("Publié. Visible par tous d'ici ~1 minute.");stamp();ebar();
 }catch(err){toast("Échec de la publication ("+err.message+")");dirty=true;ebar()}
}
async function discard(){
 if(!confirm("Annuler toutes les modifications non publiées ?"))return;
 try{localStorage.removeItem(DRAFT_KEY)}catch(e){}PENDING={};dirty=false;await loadData();makeNodes();build();renderAll();fitStage();drawEdges();ebar();
}
function mountEditBar(){
 document.body.classList.add("edit");
 const b=document.createElement("div");b.id="ebar";b.innerHTML=`<span class="elab">Édition</span><span id="estat"></span><button class="btn" data-disc>Annuler</button><button class="btn p" data-pub>Publier</button><button class="btn" data-tok title="Changer de jeton GitHub">Jeton</button>`;
 $(".bar").appendChild(b);
 b.querySelector("[data-pub]").onclick=publish;b.querySelector("[data-disc]").onclick=discard;
 b.querySelector("[data-tok]").onclick=()=>{const t=prompt("Nouveau jeton GitHub (reste dans ce navigateur)");if(t){TOKEN=t.trim();try{localStorage.setItem(TOKEN_KEY,TOKEN)}catch(e){}toast("Jeton enregistré")}};
 ebar();
}

/* =========== Chargement =========== */
async function loadData(){
 let src;
 if(EDIT){try{const r=await gh(`/data.json?ref=${REPO.branch}`,{headers:{Accept:"application/vnd.github.raw+json"}});if(r.ok)src=await r.json()}catch(e){}}
 if(!src){const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});src=await r.json()}
 DATA=src;serverStamp=DATA.updated;
}
async function poll(){
 if(EDIT||document.hidden)return;
 try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const n=await r.json();if(n.updated&&n.updated!==serverStamp){DATA=n;serverStamp=n.updated;makeNodes();build();renderAll();fitStage();drawEdges()}}catch(e){}
}
function layoutMode(){document.body.classList.toggle("m",mobile());applyZoom()}
async function start(){
 if(EDIT_REQ){TOKEN=localStorage.getItem(TOKEN_KEY)||"";if(!TOKEN){TOKEN=(prompt("Mode édition : colle ton jeton GitHub (il reste dans ce navigateur)")||"").trim();if(TOKEN)try{localStorage.setItem(TOKEN_KEY,TOKEN)}catch(e){}}EDIT=!!TOKEN}
 try{await loadData()}catch(e){document.body.innerHTML='<p style="color:#fff;padding:40px;font:15px system-ui">Contenu indisponible pour le moment. Réessaie dans un instant.</p>';return}
 if(EDIT){try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");if(d&&d.data){DATA=d.data;PENDING=d.pending||{};dirty=true;if(d.base)serverStamp=d.base}}catch(e){}}
 makeNodes();build();renderPills();stamp();
 if(EDIT)mountEditBar();
 z=fitZ();layoutMode();autoLayout();addEventListener("resize",()=>{layoutMode();applyZoom();autoLayout()});
 setInterval(poll,90000);
 if(EDIT&&dirty)toast("Brouillon non publié restauré");
}
start();

</script>
