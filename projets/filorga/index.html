<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#000000">
<title>Filorga — 4 campagnes · 19+20 nov. 2026</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0c0c;--mute:#7b7b7b;--line:#e4e4e4;--soft:#f5f5f5;--sans:"Hanken Grotesk",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:400 14px/1.45 var(--sans);color:var(--ink);background:#000;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}

/* ---- barre du haut ---- */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 18px;background:linear-gradient(#000 60%,rgba(0,0,0,0));color:#fff}
.bar b{font-weight:600;letter-spacing:-.01em;font-size:15px;margin-right:auto;white-space:nowrap}
.bar small{color:#9a9a9a;font-size:12px;margin-right:6px}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:70vw}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;padding:5px 13px;font-size:13px;transition:.15s}
.pill:hover{border-color:#fff}
.pill.on{background:#fff;color:#000;border-color:#fff}

/* ---- canvas ---- */
#view{position:fixed;inset:0;overflow:auto;background:linear-gradient(180deg,#000 0%,#000 5%,#7d7d7d 42%,#e9e9e9 74%,#fff 100%) local}
#stage{position:relative;margin:0 auto}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.node{position:absolute;background:#fff;border:1px solid rgba(0,0,0,.14);border-radius:4px;box-shadow:0 14px 34px -12px rgba(0,0,0,.45)}
.node.drag{box-shadow:0 24px 50px -12px rgba(0,0,0,.6);z-index:5}
.node.me{box-shadow:0 0 0 3px #000,0 0 0 5px #fff,0 14px 34px -12px rgba(0,0,0,.45)}
.nh{display:flex;justify-content:space-between;align-items:center;padding:9px 14px 8px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);cursor:grab;user-select:none;touch-action:none}
.nh i{font-style:normal;letter-spacing:0;text-transform:none;font-size:12px}
.nb{padding:14px}
.node h3{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.node h2{margin:0;font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.05}
.node p{margin:0 0 8px;color:#3d3d3d}
.sub{color:var(--mute);font-size:13px}
.node ul{list-style:none;margin:0;padding:0}
.node li{padding:7px 0;border-top:1px solid var(--line)}
.node li:first-child{border-top:0}

/* hero */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:16px}
.facts span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.facts b{font-weight:500;font-size:14px}
.facts.crew{grid-template-columns:repeat(3,1fr);gap:16px 20px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.facts.crew b{font-size:15px}
body.m .facts.crew{grid-template-columns:1fr 1fr}
.cd{display:flex;align-items:baseline;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.cd strong{font-size:34px;font-weight:500;letter-spacing:-.03em}

/* campagnes */
.band{height:84px;margin:-14px -14px 12px;border-bottom:1px solid var(--line)}
.tag{display:inline-block;border:1px solid #cfcfcf;border-radius:99px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
.tag.k{background:#000;color:#fff;border-color:#000}
textarea,select,input[type=text]{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:3px;padding:8px 10px}
textarea{min-height:64px;resize:vertical;line-height:1.45}
textarea:focus,select:focus,input:focus{outline:2px solid #000;outline-offset:-1px;background:#fff}

/* images de référence */
.rimg{display:block;width:100%;height:auto;border-radius:3px;margin-top:10px;border:1px solid var(--line);cursor:zoom-in;background:#000}
.refs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.refs img{width:100%;height:112px;object-fit:cover;border-radius:3px;border:1px solid var(--line);cursor:zoom-in;display:block}
.kn.lk small{display:block;margin-top:2px}
.kn.lk small a{color:inherit}
.refs.one{grid-template-columns:1fr}
.refs.one img{height:auto;object-fit:contain;background:#fff}
.refs.three{grid-template-columns:1fr 1fr 1fr}
.refs.three img{height:120px}
.node p.v{color:var(--ink)}
.node ul.v>li,.node ol.v>li{padding:9px 0}
.node ol.v{padding-left:18px;margin:0}
.node ol.v>li{border-top:1px solid var(--line)}
.node ul.s{margin:6px 0 0;padding-left:16px;list-style:disc}
.node ul.s li{border:0;padding:2px 0}
#lb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 20px 80px rgba(0,0,0,.6)}
/* fonds */
.sw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw div{height:74px;border:1px solid var(--line);border-radius:3px;display:flex;align-items:flex-end;padding:7px;font-size:12px}
.sw div span{background:rgba(255,255,255,.88);padding:1px 6px;border-radius:2px}
.sw .dark span{background:rgba(0,0,0,.6);color:#fff}

/* planning */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slots label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}

/* hub / départements */
.hub .nb{padding:12px 16px;text-align:center}
.hub h3{font-size:17px;margin:0}
.dept{cursor:pointer}
.dept:hover{box-shadow:0 18px 40px -12px rgba(0,0,0,.55)}
.bardone{height:4px;background:var(--line);border-radius:2px;margin:10px 0 12px;overflow:hidden}
.bardone i{display:block;height:100%;background:#000}
.dept li{font-size:13px;color:#3d3d3d}
.open{display:inline-block;margin-top:10px;font-size:13px;font-weight:500;border-bottom:1px solid #000}

/* équipe / questions */
.team{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.team li{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.team li span{color:var(--mute)}
.team li.tbc b{color:#aaa;font-weight:400;font-style:italic}
.ql li{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:13px}
.ql li:hover{background:var(--soft)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:#000;margin-top:6px}
.dot.ok{background:transparent;border:1.5px solid #9a9a9a}

/* boutons */
.btn{display:inline-block;border:1px solid #000;border-radius:3px;padding:7px 13px;font-size:13px;font-weight:500;background:#fff;cursor:pointer}
.btn:hover{background:#000;color:#fff}
.btn.p{background:#000;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* zoom */
.zoom{position:fixed;left:18px;bottom:18px;z-index:30;display:flex;background:#fff;border:1px solid rgba(0,0,0,.2);border-radius:4px;box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
.zoom button{padding:8px 13px;font-size:14px;border-right:1px solid var(--line)}
.zoom button:last-child{border:0;font-size:12px}
.zoom button:hover{background:var(--soft)}

/* tiroir */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:.2s}
#shade.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(var(--dw,540px),100vw);background:#fff;z-index:41;transform:translateX(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.35)}
#drawer.on{transform:none}
.dh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.dh h2{font-size:26px;font-weight:500;letter-spacing:-.025em;margin:0}
.dh button{font-size:26px;line-height:1;padding:2px 8px}
.ds{padding:20px 22px;border-bottom:1px solid var(--line)}
.ds ul{list-style:none;margin:0;padding:0}
.ds h4{margin:0 0 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:500}
.ds li{padding:8px 0 8px 16px;border-top:1px solid var(--line);position:relative}
.ds li:first-child{border-top:0}
.det.bl>span{display:block;position:relative;padding-left:14px}
.det.bl>span:not(.ed)::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:#000}
.det.bl>span.ed{padding-left:0;min-width:240px}
.notebox{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:12px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;min-height:64px}
.notebox .ed{display:block;min-height:40px}
.ds .kn li::before{content:"";position:absolute;left:0;top:15px;width:6px;height:6px;border-radius:50%;background:#000}
.ds .kn li.w::before{background:transparent;border:1.5px solid #000}
.ds small{display:block;color:var(--mute)}
.ck li{display:flex;gap:11px;align-items:flex-start;padding-left:0}
.ck .mk-l{cursor:pointer;display:flex;flex:none;margin-top:5px}
.ck i.mk{flex:none;width:11px;height:11px;border-radius:50%;border:1.5px solid #b5b5b5;margin-top:5px;box-sizing:border-box}
.ck .mk-l i.mk{margin-top:0}
.ck i.mk.on{background:#000;border-color:#000}
.ck li.off .t{color:#9a9a9a;font-weight:400}
.ck .t{font-weight:500}
.det{display:block;margin-top:4px;font-size:13px;color:#555}
.det>span{display:block;padding:2px 0}
.det em{font-style:normal;color:var(--mute)}
.ck .x{margin-left:auto;color:#9a9a9a;font-size:18px;line-height:1}
.ck .x:hover{color:#000}
.pis{font-size:12px;border:1px solid #cfcfcf;border-radius:99px;padding:0 8px;margin-left:6px;color:#555}
.add{display:flex;gap:8px;margin-top:12px}
.q{border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:10px}
.q.done{opacity:.55}
.q header{display:flex;justify-content:space-between;gap:12px}
.q h5{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.st{flex:none;border:1px solid #000;border-radius:99px;padding:2px 11px;font-size:12px;height:fit-content}
.st.r{background:#000;color:#fff}
.q .tags{margin:8px 0}
.q textarea{min-height:56px}
.fl{display:flex;gap:6px;flex-wrap:wrap}
.fl button{border:1px solid #cfcfcf;border-radius:99px;padding:3px 11px;font-size:12px}
.fl button.on{background:#000;color:#fff;border-color:#000}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);background:#fff;color:#000;padding:9px 16px;border-radius:3px;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:.2s;pointer-events:none;z-index:60;font-size:13px}
.toast.on{opacity:1;transform:translateX(-50%)}

/* mobile : colonne simple, plus de câbles */
body.m{background:linear-gradient(#000 0,#000 3%,#777 35%,#e8e8e8 70%,#fff 100%) fixed}
body.m #view{position:static;overflow:visible;padding:64px 14px 90px}
body.m #stage{width:auto!important;height:auto!important;background:none}
body.m #world{position:static;transform:none!important}
body.m #edges{display:none}
body.m .node{position:static;width:auto!important;margin:0 0 14px}
body.m .nh{cursor:default}
body.m .node.dept{position:relative;left:0!important;top:0!important}
body.m .dic{width:52px;height:52px;top:48px;right:18px}
body.m .zoom{display:none}
body.m .pills{max-width:62vw}
body.m .bar small{display:none}

/* lecture seule / édition */
.slots b{font-weight:500}.slots b.tbc{color:#9a9a9a;font-weight:400;font-style:italic}
.node h2.pl{white-space:pre-line;font-size:84px;line-height:1;letter-spacing:-.035em;font-weight:600;margin:22px 0 12px}
#n_root .sub{font-size:18px}
.team .rt{display:inline-flex;align-items:center}
.q .ans{margin-top:8px;padding:10px 12px;background:var(--soft);border-radius:3px;white-space:pre-wrap}
.rw{position:relative}
.ed{outline:none;border-radius:2px;min-width:2ch}
.ed:empty::before{content:attr(data-ph);color:#aaa;font-weight:400}
body.edit .ed{box-shadow:inset 0 -1px 0 rgba(0,0,0,.28)}
body.edit .ed:hover{background:rgba(0,0,0,.05)}
body.edit .ed:focus{background:#fff;box-shadow:0 0 0 2px #000}
.xdel{color:#999;font-size:17px;line-height:1;margin-left:6px;padding:0 4px;vertical-align:middle}
.xdel:hover{color:#000}
.rw .xdel{position:absolute;top:4px;right:4px;background:#fff;border-radius:99px;width:20px;height:20px;padding:0;margin:0;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.xadd{display:inline-block;font-size:12px;border:1px dashed #8a8a8a;border-radius:99px;padding:2px 11px;margin:8px 6px 0 0;color:#333;background:#fff}
.xadd:hover{border-style:solid;border-color:#000}
.wk{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--mute);margin-top:2px}
.dt{width:auto;margin-left:auto;padding:3px 6px;font-size:12px}
#ebar{display:flex;align-items:center;gap:8px;margin-left:12px}
#ebar .elab{border:1px solid #fff;border-radius:99px;padding:3px 11px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
#estat{font-size:12px;color:#bbb;white-space:nowrap}
#ebar .btn{padding:5px 12px;border-color:#fff;background:transparent;color:#fff}
#ebar .btn.p{background:#fff;color:#000}
#ebar .btn:disabled{opacity:.35;cursor:default}
#ebar .btn:not(:disabled):hover{background:#fff;color:#000}
body.edit .nh{cursor:grab}body:not(.edit) .nh{cursor:default}
body.edit .pills{max-width:42vw}

/* dernières nouvelles */
.node.newsn{background:transparent;border:0;box-shadow:none}
.node.newsn .nh{display:none}
.node.newsn .nb{padding:0}
.newsn .news{margin-top:0;color:#fff;background:linear-gradient(135deg,rgba(255,110,110,.22),rgba(255,70,70,.32));border-color:rgba(255,120,120,.6);box-shadow:0 12px 30px -16px rgba(255,80,80,.5)}
.newsn .news{position:relative;overflow:hidden;animation:nglow 7s ease-in-out infinite}
.newsn .news::after{content:"";position:absolute;top:0;bottom:0;left:-50%;width:35%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-18deg);animation:nsweep 11s ease-in-out infinite;pointer-events:none}
@keyframes nsweep{0%{left:-50%}35%,100%{left:130%}}
@keyframes nglow{0%,100%{box-shadow:0 12px 30px -16px rgba(255,80,80,.5),0 0 0 0 rgba(255,110,110,0)}50%{box-shadow:0 12px 30px -16px rgba(255,80,80,.55),0 0 14px 0 rgba(255,110,110,.16)}}
@media (prefers-reduced-motion:reduce){.newsn .news,.newsn .news::after{animation:none}}
.newsn .news .nt span{color:rgba(255,255,255,.65)}
.newsn .news .nd{color:#ffb4b4}
.newsn .news li{border-top-color:rgba(255,150,150,.3)}
.newsn .news .nk{color:#ffc9c9;border-color:rgba(255,170,170,.6)}
.newsn .news .nk.add,.newsn .news .nk.ajout{color:#fff}
.news{margin-top:20px;padding:12px 14px 10px;border-radius:7px;background:linear-gradient(135deg,rgba(255,138,138,.16),rgba(255,92,92,.24));border:1px solid rgba(214,84,84,.38);box-shadow:0 12px 30px -16px rgba(190,60,60,.6),inset 0 1px 0 rgba(255,255,255,.7);backdrop-filter:blur(6px)}
.news .nt{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.news .nt b{font-weight:600}
.news .nt span{margin-left:auto;color:var(--mute);letter-spacing:0;text-transform:none;font-size:12px}
.pd{width:8px;height:8px;border-radius:50%;background:#d9534f;flex:none;animation:pd 2s ease-out infinite}
@keyframes pd{0%{box-shadow:0 0 0 0 rgba(217,83,79,.55)}100%{box-shadow:0 0 0 9px rgba(217,83,79,0)}}
.news ul{margin-top:8px}
.news li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:6px 0;font-size:13px;border-top:1px solid rgba(214,84,84,.22)}
.news li:first-child{border-top:0}
.nx.go{cursor:pointer}
.nx.go:hover{text-decoration:underline}
.news li small{margin-left:auto;color:var(--mute);font-size:11px;white-space:nowrap}
.news li{display:block}
.news .nm,.ds.news-d .nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.nd{font-size:14px;font-weight:600;color:#a83a3a;letter-spacing:-.01em}
.dp{font-size:11px;font-weight:500;letter-spacing:.04em;background:#000;color:#fff;border-radius:99px;padding:1px 10px}
.ntx{display:flex;gap:8px;align-items:baseline}
.ntx .nk{flex:none}
.nk{flex:none;font-size:10px;letter-spacing:.07em;text-transform:uppercase;border:1px solid #c94a4a;color:#a83a3a;border-radius:99px;padding:0 7px}
.nk.ajout{background:#c94a4a;color:#fff}.nk.retrait{border-color:#aaa;color:#888}
.ds.news-d{background:rgba(255,120,120,.1)}
.ds.news-d li{padding:7px 0;border-top:1px solid rgba(214,84,84,.22)}
.ds.news-d li:first-child{border-top:0}
.ds.news-d li::before{display:none}
.ds.news-d small{display:inline;margin-left:auto}
.nw{display:inline-block;vertical-align:middle;margin-left:8px;font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;background:#000;color:#fff;border-radius:99px;padding:1px 8px}
.rto{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:0 2px;font-size:12px}
.rto .xadd{margin:4px 4px 0 0}
.xadd.on{background:#000;color:#fff;border:1px solid #000}
/* campagnes : tuiles + fenêtre agrandie */
.ctiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ct{position:relative;border-radius:6px;overflow:hidden;cursor:pointer;background:#fff;border:1px solid rgba(0,0,0,.18);box-shadow:0 10px 24px -14px rgba(0,0,0,.6);transition:transform .28s cubic-bezier(.16,1,.3,1),box-shadow .28s}
.ct:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 24px 42px -16px rgba(0,0,0,.7)}
.ct .cth{height:92px;padding:12px 14px;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.ct .cth small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.ct .cth b{font-size:20px;font-weight:600;letter-spacing:-.02em;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.ct img{width:100%;height:104px;object-fit:cover;display:block}
.ct p{margin:0;padding:10px 14px 4px;font-size:12.5px;color:#3d3d3d}
.ct .cgo{display:block;padding:2px 14px 12px;font-size:12px;font-weight:500}
#cv{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.62);backdrop-filter:blur(5px);opacity:0;transition:opacity .3s}
#cv.on{display:flex}#cv.vis{opacity:1}
.cvp{width:min(1000px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:8px;box-shadow:0 40px 100px -20px rgba(0,0,0,.8);will-change:transform,opacity,filter}
.cvh{position:sticky;top:0;z-index:2;padding:20px 26px 18px;color:#fff;display:flex;align-items:flex-end;gap:16px}
.cvh .cvn{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;display:block;margin-bottom:4px}
.cvh h2{font-size:44px;line-height:1.05;margin:0;font-weight:600;letter-spacing:-.03em;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.cvb{margin-left:auto;display:flex;gap:6px}
.cvb button{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);color:#000;font-size:20px;line-height:1}
.cvb button:hover{background:#fff}
.cvbd{padding:20px 26px 28px}
.cvbd h4{margin:22px 0 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:500}
.cvbd p{margin:0 0 10px}

<script>
/* =========== Configuration =========== */
const REPO={owner:"moodpics",repo:"sebtran",dir:"projets/filorga",branch:"main"};
const TOKEN_KEY="filorga-gh-token",DRAFT_KEY="filorga-draft-v1",VIEW_KEY="filorga-view-v1";
const API=`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${REPO.dir}`;
const EDIT_REQ=location.hash==="#edit";
let EDIT=false,TOKEN="",DATA=null,BASE=null,PENDING={},dirty=false,serverStamp="";
let V={role:"",z:0};try{V=Object.assign(V,JSON.parse(localStorage.getItem(VIEW_KEY)||"{}"))}catch(e){}
const saveView=()=>{try{localStorage.setItem(VIEW_KEY,JSON.stringify(V))}catch(e){}};

/* =========== Utilitaires =========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),m.length>70?9000:2600)};
const get=p=>p.split(".").reduce((o,k)=>o==null?o:o[k],DATA);
const set=(p,v)=>{const a=p.split("."),k=a.pop();a.reduce((o,x)=>o[x],DATA)[k]=v};
const imgSrc=s=>PENDING[s]?PENDING[s].url:s;
const mobile=()=>innerWidth<1000;
const uid=()=>Math.random().toString(36).slice(2,8);
const D=id=>DATA.depts.find(d=>d.id===id);
const di=id=>DATA.depts.findIndex(d=>d.id===id);
const isDone=t=>!!((t.lines&&t.lines.length)||(t.fix&&t.fix.length)||(t.ctl&&t.ctl.length)||(t.mir&&t.mir.length));

/* champs éditables : en lecture seule ce sont de simples textes */
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const TAGRE=/\s*#(cam|camera|lum|lumiere|mach|machinerie)\b/gi;
const TAGMAP={cam:"cam",camera:"cam",lum:"lum",lumiere:"lum",mach:"mach",machinerie:"mach"};
const clean=s=>String(s==null?"":s).replace(TAGRE,"").trim();
let _re=null,_rk="",_rm={};
function campRe(){const cs=(DATA&&DATA.camps)||[];const k=cs.map(c=>c.name+"|"+(c.alias||[]).join(",")).join(";");if(k===_rk)return _re;_rk=k;_rm={};
 const names=[];cs.forEach((c,i)=>{[c.name,...(c.alias||[])].forEach(n=>{if(n){names.push(n);_rm[n.toLowerCase()]=i}})});
 names.sort((a,b)=>b.length-a.length);
 _re=names.length?new RegExp("\\b("+names.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","gi"):null;return _re}
const campChip=i=>`<span class="cp cc${i%4}" data-cpo="${i}" title="Ouvrir la fiche">${esc(DATA.camps[i].name)}</span>`;
function rich(t){const h=esc(clean(t));const re=campRe();if(!re)return h;return h.replace(re,m=>{const i=_rm[m.toLowerCase()];return i==null?m:campChip(i)})}
function campChips(ids){const cs=DATA.camps;ids=(ids||[]).filter(id=>cs.some(c=>c.id===id));
 if(!ids.length)return `<span class="cp all">Tous les films</span>`;
 const grp=cs.filter(c=>c.fond==="grad").map(c=>c.id);
 if(grp.length>1&&grp.length===ids.length&&grp.every(x=>ids.includes(x)))return `<span class="cpg">${grp.map(g=>campChip(cs.findIndex(c=>c.id===g))).join("")}<em>même fond</em></span>`;
 return ids.map(id=>campChip(cs.findIndex(c=>c.id===id))).join("")}
const campTog=(path,ids)=>EDIT?`<div class="ctg">${DATA.camps.map((c,i)=>`<button class="cp cc${i%4}${(ids||[]).includes(c.id)?" on":""}" data-ctog="${path}" data-cid="${c.id}">${esc(c.name)}</button>`).join("")}<span class="sub">(aucun = tous les films)</span></div>`:"";
const MOODN={grad:"Mood noir et blanc dégradé",incrust:"Mood incruste"};
const FOND={grad:{n:"Fond dégradé",g:"{n} {f} · fond dégradé noir → blanc",d:"Haut / bas, créé à la lumière : rangée de Skypanel X Hyperoptics sur le grill, borniol en top."},incrust:{n:"Fond incruste",g:"{n} {f} · ciel bleu / bleu incruste",d:"Toile chroma key bleue d'environ 8 × 6 m par-dessus le cyclo. Ciel bleu pour les plans à l'horizon (clair en bas, plus sombre en haut), bleu incruste pour le sol des top shots."}};
function baseBlock(){const cs=DATA.camps,R=(DATA.root&&DATA.root.base)||{t:"",p:""};return `<div class="base"><div class="b0"><i class="bbar"></i><div><b>${ed("root.base.t","span","",R.t,"Base commune")}</b><div class="bp0">${ed("root.base.p","span","",R.p,"Explication")}</div></div></div><div class="bsplit">${["grad","incrust"].map(k=>{const m=cs.map((c,i)=>[c,i]).filter(([c])=>c.fond===k);if(!m.length)return "";return `<div class="bf"><i class="fbar ${k}"></i><div><b>${esc(MOODN[k])} · ${m.length} ${m.length>1?"films":"film"}</b><span class="d">${esc(FOND[k].d)}</span><div class="fgc">${m.map(([c,i])=>campChip(i)).join("")}</div>${(()=>{const mm=((DATA.mood||{}).moods||[])[k==="grad"?0:1],im=mm&&mm.img;return im?`<img class="bfimg ${k}" data-zoom src="${esc(imgSrc(im))}" alt="${esc(MOODN[k])}" loading="lazy"><span class="bfc">${k==="grad"?"Référence du fond":"Storyboard pour l'instant"} · clique pour agrandir</span>`:""})()}</div></div>`}).join("")}</div></div>`}
function fixData(d){(d.depts||[]).forEach(x=>{x.open=x.open||[];x.open.forEach(o=>{o.c=o.c||[];o.sol=o.sol||[]});});(d.camps||[]).forEach(c=>{c.alias=c.alias||[]});d.root=d.root||{};d.root.base=d.root.base||{t:"Base commune : le fond cyclo blanc",p:"Tous les films sont tournés sur le fond cyclo blanc. C'est à partir de cette base que chaque fond est travaillé."};if(d.mood){d.mood.moods=d.mood.moods||[];d.mood.moods.forEach(m=>{m.c=m.c||[];m.lines=m.lines||[]})}return d}

const clip=(s,n=230)=>s.length>n?s.slice(0,n).replace(/\s+\S*$/,"")+"…":s;
const RULES=[
 {re:/(mouvement|dolly|jib|ronin|travelling|steadicam|\brail\b|grue|robotique|camera (avance|monte|recule|tourne))/,to:["cam","mach"]},
 {re:/(optique|filtre|focale|\bfps\b|objectif|alexa|master prime)/,to:["cam"]},
 {re:/(lumiere|eclairage|projecteur|gobo|lumen|skypanel|sypanel|keylight|borniol|floppy|batter|loading|astera|hyperion|hyperoptic|plexi|\bled\b|fresnel|\bhmi\b|dimmer|backlight|negativ fill|spotlight|\bspot\b)/,to:["lum"],from:["brief","camp"]},
 {re:/(\brig\b|rigs|rigging|\bgril|grill|\btop\b|truss|structure|perche|accroche|fixer|suspen)/,to:["mach"],from:["lum","brief","camp"]}
];
function unitsOf(Dt,withMood){
 const u=[],add=(text,src,srcId,to,tk)=>{if(text&&String(text).trim())u.push({text:String(text),src,srcId,to:to||null,tk:tk||null})};
 if(Dt.brief.sum){add(Dt.brief.sum.t,"Brief","brief");(Dt.brief.sum.sub||[]).forEach(x=>add(x,"Brief","brief"))}
 Dt.brief.items.forEach(it=>{add(it.t,"Brief","brief",it.to);(it.sub||[]).forEach(x=>add(x,"Brief","brief",it.to))});
 Dt.camps.forEach(c=>{add(c.txt,c.name,"camp");if(c.pist)add(c.pist,c.name+" · piste","camp");[["lum","Lumière"],["cam","Caméra"],["mach","Machinerie"]].forEach(([k,n])=>(c[k]||[]).forEach(l=>add(l,c.name+" · "+n,"camp",[{d:k}])))});
 if(withMood){(Dt.mood.items||[]).forEach(t=>add(t,"Mood","mood",["lum"]));(Dt.mood.moods||[]).forEach(m=>add(m.t+" : "+m.d,"Mood","mood",["lum"]))}
 Dt.depts.forEach(d=>{d.known.forEach(k=>add(k.t,d.name,d.id,k.to,k.from?"synced":null));d.todo.forEach(t=>(t.lines||[]).forEach(l=>add(l,d.name+" · "+t.t,d.id,t.to,d.id+"|"+norm(t.t).trim())));if(d.notes)add(d.notes,d.name+" · notes",d.id)});
 return u;
}
/* où une ligne est envoyée : #tags + cases « Envoyer vers » ; à défaut, mots-clés */
function routeOf(u){
 const to=new Set();
 [...u.text.matchAll(/#(cam|camera|lum|lumiere|mach|machinerie)\b/gi)].forEach(m=>to.add(TAGMAP[norm(m[1])]));
 (u.to||[]).forEach(x=>{if(x)to.add(x.d||x)});
 if(!to.size){const n=norm(u.text);RULES.forEach(r=>{if(r.from&&!r.from.includes(u.srcId))return;if(r.re.test(n))r.to.forEach(x=>to.add(x))})}
 return to;
}
/* le brief écrit directement dans la bonne sous-partie du département */
function syncBrief(i){
 const it=DATA.brief.items[i];if(!it)return;if(!it.id)it.id=uid();
 const lines=[clean(it.t),...(it.sub||[]).map(clean)].filter(Boolean);
 (it.to||[]).forEach(t=>{if(!t||!t.d)return;const d=D(t.d);if(!d)return;
  if(t.s==="@known"){let k=d.known.find(x=>x.from===it.id);if(!k){k={t:"",sub:"",w:0,from:it.id};d.known.push(k)}k.t=lines[0]||"";k.sub=lines.slice(1).join(" · ")}
  else{const td=d.todo.find(x=>norm(x.t).trim()===norm(t.s).trim());if(td)td.lines=lines.slice()}
 });
}
/* lignes écrites directement dans un département : recopiées dans les autres départements choisis */
function syncDept(){
 DATA.depts.forEach(d=>{d.known=d.known.filter(k=>!(k.from&&String(k.from).startsWith("dept:")));d.todo.forEach(t=>{t.mir=[]})});
 DATA.depts.forEach(src=>{
  const push=(lines,to,id)=>(to||[]).forEach(r=>{if(!r||!r.d||r.d===src.id)return;const dst=D(r.d);if(!dst)return;
   if(r.s==="@known")lines.forEach((l,i)=>dst.known.push({t:l,sub:"depuis "+src.name,w:0,from:"dept:"+id+":"+i}));
   else{const td=dst.todo.find(x=>norm(x.t).trim()===norm(r.s).trim());if(td)lines.forEach(l=>td.mir.push({text:l,src:src.name}))}});
  src.known.forEach((k,i)=>{if(!k.from&&k.to&&k.to.length&&k.t)push([clean(k.t)],k.to,src.id+"k"+i)});
  src.todo.forEach((t,i)=>{if(t.to&&t.to.length&&(t.lines||[]).length)push(t.lines.map(clean),t.to,src.id+"t"+i)});
 });
 DATA.depts.forEach(d=>d.todo.forEach(t=>{if(!t.mir||!t.mir.length)delete t.mir}));
}
const ROUTEOPTS=()=>DATA.depts.flatMap(d=>[[d.id,"@known",d.name+" › À savoir"],...d.todo.map(t=>[d.id,t.t.trim(),d.name+" › "+t.t.trim()])]);
const routeLabel=t=>{const d=D(t.d);return (d?d.name:t.d)+" › "+(t.s==="@known"?"À savoir":String(t.s).trim())};
/* =========== Dernières nouvelles / modifs =========== */
const KL={modif:"Modifié",ajout:"Ajouté",retrait:"Retiré"};
const fmtAt=iso=>{const d=new Date(iso);return isNaN(d)?"":d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+" · "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})};
const toks=t=>new Set(norm(clean(t)).split(/[^a-z0-9]+/).filter(w=>w.length>2));
const sim=(a,b)=>{const x=toks(a),y=toks(b);if(!x.size||!y.size)return 0;let n=0;x.forEach(w=>{if(y.has(w))n++});return n/(x.size+y.size-n)};
function mkChange(u,kind){const d=new Set([u.srcId]);routeOf(u).forEach(x=>d.add(x));return{src:u.src,d:[...d],kind,text:clip(clean(u.text),110)}}
function diffChanges(a,b){
 const ks=u=>u.srcId+"|"+norm(clean(u.text)).trim(),sT=new Set();
 [a,b].forEach(Dt=>Dt.brief.items.forEach(it=>(it.to||[]).forEach(t=>{if(t&&t.d&&t.s!=="@known")sT.add(t.d+"|"+norm(t.s).trim())})));
 const skip=u=>u.tk==="synced"||(u.tk&&sT.has(u.tk));/* sous-parties alimentées par le brief : seul le brief est signalé */
 const A=unitsOf(a,1),B=unitsOf(b,1);
 const sa=new Set(A.map(ks)),sb=new Set(B.map(ks));
 const add=B.filter(u=>!sa.has(ks(u))&&!skip(u)),rem=A.filter(u=>!sb.has(ks(u))&&!skip(u)),used=new Set(),out=[];
 add.forEach(u=>{let best=-1,bs=0;rem.forEach((r,i)=>{if(used.has(i)||r.srcId!==u.srcId)return;const v=sim(r.text,u.text);if(v>bs){bs=v;best=i}});
  const mod=bs>=.4;if(mod)used.add(best);out.push(mkChange(u,mod?"modif":"ajout"))});
 const m=new Map();out.forEach(c=>{const k=c.kind+"|"+norm(c.text),e=m.get(k);if(e)c.d.forEach(x=>{if(!e.d.includes(x))e.d.push(x)});else m.set(k,c)});
 return [...m.values()];
}
function srcNoDept(src,ds){const names=ds.map(x=>D(x).name.toLowerCase()),parts=String(src||"").split(" · "),first=parts[0].split(/\s+et\s+|\s*,\s*|\s*&\s*/).map(x=>x.trim().toLowerCase()).filter(Boolean);
 if(first.length&&first.every(x=>names.includes(x)))parts.shift();return parts.join(" · ")}
function newsList(list,max){
 return list.filter(c=>c.kind!=="retrait").slice(0,max).map(c=>{const ds=(c.d||[]).filter(x=>D(x)),dl=ds[0];
  return `<li><div class="nm"><span class="nd">${esc(fmtAt(c.at))}</span>${ds.map(x=>`<span class="dp d-${x}" data-link="${x}"><span class="pi">${ICON[x]||""}</span>${esc(D(x).name)}</span>`).join("")}</div><div class="ntx"><span class="nk ${esc(c.kind)}">${esc(KL[c.kind]||"")}</span><span class="nx${dl?" go":""}"${dl?` data-link="${dl}"`:""}>${(()=>{const sc=srcNoDept(c.src,ds);return (sc?rich(sc)+" : ":"")+rich(c.text)})()}</span></div></li>`}).join("");
}
const routeUI2=(path,to,own)=>EDIT?`<div class="rto"><span class="sub">Envoyer aussi vers :</span> ${(to||[]).filter(t=>t&&t.d).map((t,j)=>`<button class="xadd on" data-rrm="${path}" data-j="${j}" title="Retirer">${esc(routeLabel(t))} ×</button>`).join("")}<select data-radd="${path}"><option value="">+ sous-partie d'un autre département…</option>${ROUTEOPTS().map(([d,s2,l],k)=>d===own?"":`<option value="${k}">${esc(l)}</option>`).join("")}</select></div>`:"";
const routeUI=(i,to)=>EDIT?`<div class="rto"><span class="sub">Envoyer vers :</span> ${(to||[]).filter(t=>t&&t.d).map((t,j)=>`<button class="xadd on" data-rmroute="${i}" data-j="${j}" title="Retirer">${esc(routeLabel(t))} ×</button>`).join("")}<select data-addroute="${i}"><option value="">+ sous-partie…</option>${ROUTEOPTS().map(([d,s2,l],k)=>`<option value="${k}">${esc(l)}</option>`).join("")}</select></div>`:"";
const ed=(p,tag,cls,txt,ph)=>EDIT?`<${tag} class="${cls||""} ed" contenteditable="true" spellcheck="false" data-p="${p}" data-ph="${esc(ph||"…")}">${esc(txt)}</${tag}>`:`<${tag} class="${cls||""}">${/(^|\.)name$|^root\.|^camps\.\d+\./.test(p)?esc(clean(txt)):rich(txt)}</${tag}>`;
const edj=(p,tag,cls,arr,sep,ph)=>EDIT?`<${tag} class="${cls||""} ed" contenteditable="true" spellcheck="false" data-p="${p}" data-t="${sep==="\n"?"lines":"semi"}" data-ph="${esc(ph||"…")}">${esc((arr||[]).join(sep))}</${tag}>`:"";
const del=(p,i)=>EDIT?`<button class="xdel" data-del="${p}" data-i="${i}" title="Supprimer" aria-label="Supprimer">×</button>`:"";
const add=(p,tpl,label)=>EDIT?`<button class="xadd" data-add="${p}" data-tpl="${tpl}">+ ${esc(label)}</button>`:"";
const addimg=(p,label)=>EDIT?`<button class="xadd" data-addimg="${p}">+ ${esc(label||"image")}</button>`:"";
const tog=(p,on)=>EDIT?`<button class="xadd" data-tog="${p}" title="Met la ligne en gras dans le brief">${on?"Retirer la mise en avant":"Mettre en avant"}</button>`:"";
const setimg=(p,label)=>EDIT?`<button class="xadd" data-setimg="${p}">${esc(label||"Changer l'image")}</button>`:"";
const TPL={reco:()=>({t:""}),known:()=>({t:"",sub:"",w:0}),todo:()=>({t:"",done:0,lines:[],fix:[],ctl:[]}),ref:()=>({src:"",title:"Nouvelle référence",cap:"",link:"",linkText:""}),
 brief:()=>({id:uid(),t:"",b:1,sub:[],img:"",imgNote:"",to:[]}),str:()=>"",team:()=>({role:"",name:""}),open:()=>({id:uid(),t:"",c:[],pb:"",ch:"",sol:[]}),mood:()=>({id:uid(),t:"",d:"",c:[],lines:[],img:"",go:""}),known_mvt:()=>({t:"",sub:"",w:0,g:"mvt"}),known_rig:()=>({t:"",sub:"",w:0,g:"rig"}),known_tech:()=>({t:"",sub:"",w:0,g:"tech"}),known_conf:()=>({t:"",sub:"",w:0,g:"conf"}),known_spec:()=>({t:"",sub:"",w:0,g:"spec"}),qs:()=>({id:"q"+uid(),t:"",d:[],done:0,answer:""})};
const imgs=(p,list,cls)=>`<div class="refs ${cls||""}${list.length===1?" one":""}">${list.map((i,n)=>`<div class="rw"><img data-zoom src="${esc(imgSrc(i.src))}" alt="${esc(i.alt||"")}" loading="lazy">${(i.cap||EDIT)?`<div class="rcap">${ed(`${p}.${n}.cap`,"span","",i.cap||"","Légende de l'image")}</div>`:""}${del(p,n)}</div>`).join("")}</div>${addimg(p)}`;

/* =========== Corps des nodes =========== */
const world=$("#world"),svg=$("#edges"),stage=$("#stage");
let NODES=[],EDGES=[];const el={};
const IC='fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"';
const ICON={
 cam:`<svg viewBox="0 0 64 64" ${IC}><circle cx="19" cy="15" r="8"/><circle cx="35" cy="15" r="8"/><circle cx="19" cy="15" r="2"/><circle cx="35" cy="15" r="2"/><rect x="8" y="26" width="34" height="22" rx="3"/><path d="M42 33l14-7v22l-14-7z"/><path d="M14 52h22"/></svg>`,
 lum:`<svg viewBox="0 0 64 64" ${IC}><rect x="8" y="18" width="26" height="22" rx="3"/><path d="M34 21l11-7v32l-11-7"/><path d="M21 18v-6M21 40v8M13 58l8-10 8 10"/><path d="M51 22l7-3M52 30h8M51 38l7 3"/></svg>`,
 mach:`<svg viewBox="0 0 64 64" ${IC}><rect x="20" y="9" width="22" height="14" rx="2"/><path d="M42 13l9-4v14l-9-4"/><path d="M31 23v10"/><rect x="10" y="33" width="44" height="8" rx="2"/><circle cx="20" cy="49" r="4"/><circle cx="44" cy="49" r="4"/><path d="M4 57h56"/></svg>`};

 NODES=[{id:"shot",kind:"",x:1070,y:0,w:340,cls:"shotn"},

function body(n){

 if(n.id==="news")return `<div class="news"><div class="nt"><i class="pd"></i><b>Dernières nouvelles</b><span>Mise à jour du ${esc(fmtAt(DATA.updated))}</span></div>${(()=>{const L=(DATA.log||[]).filter(c=>c.kind!=="retrait"),cut=Date.now()-24*36e5,nw=L.filter(c=>new Date(c.at).getTime()>=cut),old=L.filter(c=>new Date(c.at).getTime()<cut);return (nw.length?`<ul class="nrec">${newsList(nw,50)}</ul>`:`<p class="sub" style="margin:6px 0 0">Rien de nouveau ces dernières 24 h.</p>`)+(old.length?`<details class="nold"><summary>Plus anciennes (${old.length})</summary><ul>${newsList(old,50)}</ul></details>`:"")})()}</div>`;

 if(n.id==="shot")return `<figure class="shot"><video src="refs/shot-filorga.mp4" poster="refs/shot-filorga.jpg" autoplay loop muted playsinline preload="auto" aria-label="Plan tourné pour Filorga"></video><figcaption><span class="shb">Shooté</span><small>Extrait du tournage des 19 et 20 novembre</small></figcaption></figure>`;
 if(n.id==="bt")return `<div class="bcl" data-brief><b>Brief général équipe</b><span class="cgo">Ouvrir ›</span></div>`;
 if(n.id==="camps"){const S=DATA.brief.sum||{t:"",sub:[]};return `<div class="sum">${ed("brief.sum.t","b","",S.t,"Résumé du projet")}${(S.sub||[]).map((x,j)=>`<div class="ss">${ed(`brief.sum.sub.${j}`,"span","",x)}${del("brief.sum.sub",j)}</div>`).join("")}${add("brief.sum.sub","str","ligne")}</div><div class="ctiles">${DATA.camps.map((c,i)=>`<div class="ct cc${i%4}" data-camp="${i}"><div class="cth" style="background:${campBg(c,i)}${c.fond==='incrust'?';--cc:#6fb1ff':''}"><small>Campagne 0${i+1}</small><b>${esc(c.name)}</b></div>${c.fond&&FOND[c.fond]?`<div class="cf ${c.fond}"><i></i>${esc(FOND[c.fond].n)}</div>`:""}${thumb(c)?`<img src="${esc(imgSrc(thumb(c).src))}" alt="" loading="lazy">`:""}<p>${esc(clip(clean(c.txt),105))}</p><span class="cgo">Ouvrir ›</span></div>`).join("")}</div>`}
 if(n.did){const d=D(n.did),done=d.todo.filter(isDone).length,tot=d.todo.length;
  return `<span class="dic" role="img" aria-label="${esc(d.name)}" title="${esc(d.name)}">${ICON[d.id]||""}</span><span class="dname">${esc(d.name)}</span>`;}
 if(n.id==="team")return `<ul class="team">${DATA.team.map((m,i)=>`<li class="${m.name||EDIT?"":"tbc"}">${ed(`team.${i}.role`,"span","",m.role,"Rôle")}<span class="rt">${EDIT?ed(`team.${i}.name`,"b","",m.name,"à confirmer"):`<b style="font-weight:500">${m.name?esc(m.name):"à confirmer"}</b>`}${del("team",i)}</span></li>`).join("")}</ul>${add("team","team","membre")}
  <p class="sub" style="margin:10px 0 0">Téléphones et mails : dans la note Evernote, non publiés ici.</p>`;
 if(n.id==="qs"){const open=DATA.qs.filter(q=>!q.done).length;
  return `<div class="sub" style="margin-bottom:6px">${open} ouvertes sur ${DATA.qs.length}</div><ul class="ql">${DATA.qs.map(q=>`<li data-openq="${q.id}"><i class="dot${q.done?" ok":""}"></i><span>${esc(q.t)}</span></li>`).join("")}</ul>`;}
 return "";

function build(){
 world.querySelectorAll(".node").forEach(n=>n.remove());
 NODES.forEach(n=>{
  const a=document.createElement("article");a.className="node "+(n.cls||"");a.id="n_"+n.id;a.style.width=n.w+"px";
  a.innerHTML=`<header class="nh"><span>${esc(n.kind)}</span></header><div class="nb">${body(n)}</div>`;
  world.appendChild(a);el[n.id]=a;place(n);drag(n,a);
  if(n.id==="camps"){const h=a.querySelector(".nh");h.dataset.cfold="1";h.insertAdjacentHTML("beforeend",'<i class="chv">›</i>')}

const pos=n=>(DATA.pos&&DATA.pos[n.id])||{x:n.x,y:n.y};
let lay=0;

 lay=requestAnimationFrame(()=>{

function countdown(){
 const a=$("#days"),b=$("#daysLabel");if(!a)return;
 const d=Math.ceil((new Date(DATA.shootDate+"T09:00:00")-new Date())/864e5);
 if(d>1){a.textContent="J-"+d;b.textContent="jours avant le tournage"}else if(d===1){a.textContent="J-1";b.textContent="demain"}else if(d===0){a.textContent="J";b.textContent="c'est aujourd'hui"}else{a.textContent="—";b.textContent="tournage passé ou en cours"}

let z=1;
function drag(n,a){
 a.querySelector(".nh").addEventListener("pointerdown",e=>{
  if(!EDIT||mobile()||e.button>0)return;e.preventDefault();
  const sx=e.clientX,sy=e.clientY,p0={...pos(n)};a.classList.add("drag");
  const mv=ev=>{DATA.pos=DATA.pos||{};DATA.pos[n.id]={x:Math.max(0,Math.round(p0.x+(ev.clientX-sx)/z)),y:Math.max(0,Math.round(p0.y+(ev.clientY-sy)/z))};place(n);drawEdges()};
  const up=()=>{removeEventListener("pointermove",mv);a.classList.remove("drag");changed();fitStage()};
  addEventListener("pointermove",mv);addEventListener("pointerup",up,{once:true});
 });
}
const rect=id=>{const n=NODES.find(x=>x.id===id),p=pos(n),e=el[id];return{x:p.x,y:p.y,w:e.offsetWidth,h:e.offsetHeight}};
function drawEdges(){
 if(mobile()){svg.innerHTML="";return}
 let out="";
 EDGES.forEach(([a,b])=>{
  const P=rect(a),C=rect(b);let x1,y1,x2,y2,path;
  if(C.y>=P.y+P.h-20){x1=P.x+P.w/2;y1=P.y+P.h;x2=C.x+C.w/2;y2=C.y;const m=(y2-y1)/2;path=`M${x1} ${y1}C${x1} ${y1+m} ${x2} ${y2-m} ${x2} ${y2}`}
  else if(C.x+C.w<=P.x){x1=P.x;y1=P.y+P.h/2;x2=C.x+C.w;y2=C.y+C.h/2;const m=(x1-x2)/2;path=`M${x1} ${y1}C${x1-m} ${y1} ${x2+m} ${y2} ${x2} ${y2}`}
  else if(C.x>=P.x+P.w){x1=P.x+P.w;y1=P.y+P.h/2;x2=C.x;y2=C.y+C.h/2;const m=(x2-x1)/2;path=`M${x1} ${y1}C${x1+m} ${y1} ${x2-m} ${y2} ${x2} ${y2}`}
  else{x1=P.x+P.w/2;y1=P.y;x2=C.x+C.w/2;y2=C.y+C.h;const m=(y1-y2)/2;path=`M${x1} ${y1}C${x1} ${y1-m} ${x2} ${y2+m} ${x2} ${y2}`}
  out+=`<path d="${path}" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="4" stroke-linecap="round"/><path d="${path}" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>`;
 });
 svg.innerHTML=out;
}
const WORLD_W=1440;
function fitStage(){
 if(mobile()){stage.style.width=stage.style.height="";world.style.transform="";world.style.width=world.style.height="";svg.setAttribute("width",0);svg.setAttribute("height",0);return}
 const W=Math.max(WORLD_W,...NODES.map(n=>{const r=rect(n.id);return r.x+r.w+40})),H=Math.max(...NODES.map(n=>{const r=rect(n.id);return r.y+r.h}))+90;
 svg.setAttribute("width",W);svg.setAttribute("height",H);
 world.style.width=W+"px";world.style.height=H+"px";world.style.transform=`scale(${z})`;
 stage.style.width=W*z+"px";stage.style.height=H*z+"px";
}
let userK=1;
const fitZ=()=>Math.min(1.35,(innerWidth-24)/WORLD_W);
function applyZoom(){z=Math.max(.25,Math.min(2,fitZ()*userK));fitStage();drawEdges()}
function zoomTo(v){userK=Math.max(.5,Math.min(1.8,v/fitZ()));applyZoom()}
$("#zoom").onclick=e=>{const b=e.target.closest("[data-z]");if(!b)return;const k=b.dataset.z;
 if(k==="+"){userK=Math.min(1.8,userK*1.15);applyZoom()}else if(k==="-"){userK=Math.max(.5,userK/1.15);applyZoom()}else if(k==="fit"){userK=1;applyZoom()}
 else if(EDIT&&confirm("Remettre tous les blocs à leur place d'origine ?")){DATA.pos={};NODES.forEach(place);changed();fitStage();drawEdges()}};

function pickImage(cb){
 const f=document.createElement("input");f.type="file";f.accept="image/*";
 f.onchange=async()=>{const file=f.files[0];if(!file)return;
  try{
   const base=file.name.replace(/\.[^.]+$/,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"image",stampN=Date.now().toString(36);
   let b64,url,ext;
   if(file.type==="image/gif"){if(file.size>4e6){toast("GIF trop lourd (4 Mo max)");return}url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)});ext="gif"}
   else{const bmp=await createImageBitmap(file),w=Math.min(1600,bmp.width),h=Math.round(bmp.height*w/bmp.width),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(bmp,0,0,w,h);url=c.toDataURL("image/jpeg",.85);ext="jpg"}
   b64=url.split(",")[1];const path=`refs/${base}-${stampN}.${ext}`;PENDING[path]={b64,url};cb(path);
  }catch(err){toast("Image illisible")}};
 f.click();
}

  syncDept();
  try{const ch=BASE?diffChanges(BASE,DATA):[];DATA.log=ch.slice(0,12).map(c=>Object.assign({at:now},c)).concat((BASE&&BASE.log)||DATA.log||[]).slice(0,40)}catch(e){}
  DATA.updated=now;
  const cur=await gh(`/data.json?ref=${REPO.branch}`);if(!cur.ok)throw new Error("lecture "+cur.status);const cj=await cur.json(),sha=cj.sha;
  try{const rem=JSON.parse(decodeURIComponent(escape(atob(cj.content.replace(/\n/g,"")))));if(rem.updated&&serverStamp&&rem.updated!==serverStamp)throw new Error("conflit : le site a été modifié ailleurs depuis ton chargement. Clique « Annuler » pour recharger la dernière version, puis refais ta modif")}catch(e){if(/^conflit/.test(e.message))throw e}
  const put=await gh("/data.json",{method:"PUT",body:JSON.stringify({message:"Filorga : mise à jour du contenu",content:b64u(JSON.stringify(DATA,null,1)+"\n"),sha,branch:REPO.branch})});
  if(!put.ok)throw new Error("écriture "+put.status);
  serverStamp=DATA.updated;BASE=JSON.parse(JSON.stringify(DATA));PENDING={};dirty=false;try{localStorage.removeItem(DRAFT_KEY)}catch(e){}
  toast("Publié. Visible par tous d'ici ~1 minute.");stamp();ebar();
 }catch(err){toast("Échec de la publication ("+err.message+")");dirty=true;ebar()}
}
async function discard(){
 if(!confirm("Annuler toutes les modifications non publiées ?"))return;
 try{localStorage.removeItem(DRAFT_KEY)}catch(e){}PENDING={};dirty=false;await loadData();makeNodes();build();renderAll();fitStage();drawEdges();ebar();
}
function mountEditBar(){
 document.body.classList.add("edit");
 const b=document.createElement("div");b.id="ebar";b.innerHTML=`<span class="elab">Édition</span><span id="estat"></span><button class="btn" data-disc>Annuler</button><button class="btn p" data-pub>Publier</button><button class="btn" data-tok title="Changer de jeton GitHub">Jeton</button>`;
 $(".bar").appendChild(b);
 b.querySelector("[data-pub]").onclick=publish;b.querySelector("[data-disc]").onclick=discard;
 b.querySelector("[data-tok]").onclick=()=>{const t=prompt("Nouveau jeton GitHub (reste dans ce navigateur)");if(t){TOKEN=t.trim();try{localStorage.setItem(TOKEN_KEY,TOKEN)}catch(e){}toast("Jeton enregistré")}};
 ebar();
}

/* =========== Chargement =========== */
async function loadData(){
 let src;
 if(EDIT){try{const r=await gh(`/data.json?ref=${REPO.branch}`,{headers:{Accept:"application/vnd.github.raw+json"}});if(r.ok)src=await r.json()}catch(e){}}
 if(!src){const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});src=await r.json()}
 DATA=fixData(src);BASE=JSON.parse(JSON.stringify(src));serverStamp=DATA.updated;
}
async function poll(){
 if(EDIT||document.hidden)return;
 try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const n=await r.json();if(n.updated&&n.updated!==serverStamp){DATA=fixData(n);serverStamp=n.updated;makeNodes();build();renderAll();fitStage();drawEdges()}}catch(e){}
}
function layoutMode(){document.body.classList.toggle("m",mobile());applyZoom()}
async function start(){
 if(EDIT_REQ){TOKEN=localStorage.getItem(TOKEN_KEY)||"";if(!TOKEN){TOKEN=(prompt("Mode édition : colle ton jeton GitHub (il reste dans ce navigateur)")||"").trim();if(TOKEN)try{localStorage.setItem(TOKEN_KEY,TOKEN)}catch(e){}}EDIT=!!TOKEN}
 try{await loadData()}catch(e){document.body.innerHTML='<p style="color:#fff;padding:40px;font:15px system-ui">Contenu indisponible pour le moment. Réessaie dans un instant.</p>';return}
 if(EDIT){try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");if(d&&d.data){DATA=d.data;PENDING=d.pending||{};dirty=true;if(d.base)serverStamp=d.base}}catch(e){}}
 makeNodes();build();renderPills();stamp();
 if(EDIT)mountEditBar();
 z=fitZ();layoutMode();autoLayout();addEventListener("resize",()=>{layoutMode();applyZoom();autoLayout()});
 setInterval(poll,90000);
 if(EDIT&&dirty)toast("Brouillon non publié restauré");
}
start();


/* largeur du tiroir : moitié de l'écran par défaut, réglable à la souris */
(function(){const R=document.documentElement,g=document.getElementById("dgrip");
 let W=0;try{W=+localStorage.getItem("filorga-dw")||0}catch(e){}
 const cl=w=>Math.max(380,Math.min(innerWidth-80,w));
 const set=w=>{W=cl(w);R.style.setProperty("--dw",W+"px")};
 set(W||Math.max(540,innerWidth/2));
 addEventListener("resize",()=>set(W));
 g.addEventListener("pointerdown",e=>{e.preventDefault();g.setPointerCapture(e.pointerId);g.classList.add("on");document.body.classList.add("rs")});
 g.addEventListener("pointermove",e=>{if(!g.hasPointerCapture(e.pointerId))return;set(innerWidth-e.clientX)});
 const up=e=>{g.classList.remove("on");document.body.classList.remove("rs");try{localStorage.setItem("filorga-dw",W)}catch(x){}};
 g.addEventListener("pointerup",up);g.addEventListener("pointercancel",up);
 g.addEventListener("dblclick",()=>{set(Math.max(540,innerWidth/2));try{localStorage.removeItem("filorga-dw")}catch(x){}});
})();
</script>
