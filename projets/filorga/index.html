<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">

<title>Filorga — 4 campagnes · 19+20 nov. 2026</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--ink:#0c0c0c;--mute:#7b7b7b;--line:#e4e4e4;--soft:#f5f5f5;--sans:"Hanken Grotesk",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:400 14px/1.45 var(--sans);color:var(--ink);background:#000;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}

/* ---- barre du haut ---- */
.bar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 18px;background:linear-gradient(#000 60%,rgba(0,0,0,0));color:#fff}
.bar b{font-weight:600;letter-spacing:-.01em;font-size:15px;margin-right:auto;white-space:nowrap}
.bar small{color:#9a9a9a;font-size:12px;margin-right:6px}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:70vw}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;padding:5px 13px;font-size:13px;transition:.15s}
.pill:hover{border-color:#fff}
.pill.on{background:#fff;color:#000;border-color:#fff}

/* ---- canvas ---- */
#view{position:fixed;inset:0;overflow:auto}
#stage{position:relative;margin:0 auto;background:linear-gradient(180deg,#000 0%,#000 7%,#7d7d7d 42%,#e9e9e9 74%,#fff 100%)}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.node{position:absolute;background:#fff;border:1px solid rgba(0,0,0,.14);border-radius:4px;box-shadow:0 14px 34px -12px rgba(0,0,0,.45)}
.node.drag{box-shadow:0 24px 50px -12px rgba(0,0,0,.6);z-index:5}
.node.me{box-shadow:0 0 0 3px #000,0 0 0 5px #fff,0 14px 34px -12px rgba(0,0,0,.45)}
.nh{display:flex;justify-content:space-between;align-items:center;padding:9px 14px 8px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);cursor:grab;user-select:none;touch-action:none}
.nh i{font-style:normal;letter-spacing:0;text-transform:none;font-size:12px}
.nb{padding:14px}
.node h3{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.node h2{margin:0;font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.05}
.node p{margin:0 0 8px;color:#3d3d3d}
.sub{color:var(--mute);font-size:13px}
.node ul{list-style:none;margin:0;padding:0}
.node li{padding:7px 0;border-top:1px solid var(--line)}
.node li:first-child{border-top:0}

/* hero */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:16px}
.facts span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.facts b{font-weight:500;font-size:14px}
.cd{display:flex;align-items:baseline;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.cd strong{font-size:34px;font-weight:500;letter-spacing:-.03em}

/* campagnes */
.band{height:84px;margin:-14px -14px 12px;border-bottom:1px solid var(--line)}
.tag{display:inline-block;border:1px solid #cfcfcf;border-radius:99px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
.tag.k{background:#000;color:#fff;border-color:#000}
textarea,select,input[type=text]{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:3px;padding:8px 10px}
textarea{min-height:64px;resize:vertical;line-height:1.45}
textarea:focus,select:focus,input:focus{outline:2px solid #000;outline-offset:-1px;background:#fff}

/* images de référence */
.rimg{display:block;width:100%;height:auto;border-radius:3px;margin-top:10px;border:1px solid var(--line);cursor:zoom-in;background:#000}
.refs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.refs img{width:100%;height:112px;object-fit:cover;border-radius:3px;border:1px solid var(--line);cursor:zoom-in;display:block}
.refs.three{grid-template-columns:1fr 1fr 1fr}
.refs.three img{height:120px}
.node p.v{color:var(--ink)}
.node ul.v>li,.node ol.v>li{padding:9px 0}
.node ol.v{padding-left:18px;margin:0}
.node ol.v>li{border-top:1px solid var(--line)}
.node ul.s{margin:6px 0 0;padding-left:16px;list-style:disc}
.node ul.s li{border:0;padding:2px 0}
#lb{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 20px 80px rgba(0,0,0,.6)}
/* fonds */
.sw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw div{height:74px;border:1px solid var(--line);border-radius:3px;display:flex;align-items:flex-end;padding:7px;font-size:12px}
.sw div span{background:rgba(255,255,255,.88);padding:1px 6px;border-radius:2px}
.sw .dark span{background:rgba(0,0,0,.6);color:#fff}

/* planning */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slots label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}

/* hub / départements */
.hub .nb{padding:12px 16px;text-align:center}
.hub h3{font-size:17px;margin:0}
.dept{cursor:pointer}
.dept:hover{box-shadow:0 18px 40px -12px rgba(0,0,0,.55)}
.bardone{height:4px;background:var(--line);border-radius:2px;margin:10px 0 12px;overflow:hidden}
.bardone i{display:block;height:100%;background:#000}
.dept li{font-size:13px;color:#3d3d3d}
.open{display:inline-block;margin-top:10px;font-size:13px;font-weight:500;border-bottom:1px solid #000}

/* équipe / questions */
.team{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.team li{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.team li span{color:var(--mute)}
.team li.tbc b{color:#aaa;font-weight:400;font-style:italic}
.ql li{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:13px}
.ql li:hover{background:var(--soft)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:#000;margin-top:6px}
.dot.ok{background:transparent;border:1.5px solid #9a9a9a}

/* boutons */
.btn{display:inline-block;border:1px solid #000;border-radius:3px;padding:7px 13px;font-size:13px;font-weight:500;background:#fff;cursor:pointer}
.btn:hover{background:#000;color:#fff}
.btn.p{background:#000;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* zoom */
.zoom{position:fixed;left:18px;bottom:18px;z-index:30;display:flex;background:#fff;border:1px solid rgba(0,0,0,.2);border-radius:4px;box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
.zoom button{padding:8px 13px;font-size:14px;border-right:1px solid var(--line)}
.zoom button:last-child{border:0;font-size:12px}
.zoom button:hover{background:var(--soft)}

/* tiroir */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:.2s}
#shade.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);background:#fff;z-index:41;transform:translateX(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.35)}
#drawer.on{transform:none}
.dh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.dh h2{font-size:26px;font-weight:500;letter-spacing:-.025em;margin:0}
.dh button{font-size:26px;line-height:1;padding:2px 8px}
.ds{padding:20px 22px;border-bottom:1px solid var(--line)}
.ds ul{list-style:none;margin:0;padding:0}
.ds h4{margin:0 0 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:500}
.ds li{padding:8px 0 8px 16px;border-top:1px solid var(--line);position:relative}
.ds li:first-child{border-top:0}
.ds .kn li::before{content:"";position:absolute;left:0;top:15px;width:6px;height:6px;border-radius:50%;background:#000}
.ds .kn li.w::before{background:transparent;border:1.5px solid #000}
.ds small{display:block;color:var(--mute)}
.ck li{display:flex;gap:11px;align-items:flex-start;padding-left:0}
.ck input[type=checkbox]{accent-color:#000;width:17px;height:17px;margin-top:2px;flex:none}
.ck li.done .t{color:#8a8a8a}
.ck .t{font-weight:500}
.det{display:block;margin-top:4px;font-size:13px;color:#555}
.det>span{display:block;padding:2px 0}
.det em{font-style:normal;color:var(--mute)}
.ck .x{margin-left:auto;color:#9a9a9a;font-size:18px;line-height:1}
.ck .x:hover{color:#000}
.pis{font-size:12px;border:1px solid #cfcfcf;border-radius:99px;padding:0 8px;margin-left:6px;color:#555}
.add{display:flex;gap:8px;margin-top:12px}
.q{border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:10px}
.q.done{opacity:.55}
.q header{display:flex;justify-content:space-between;gap:12px}
.q h5{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.st{flex:none;border:1px solid #000;border-radius:99px;padding:2px 11px;font-size:12px;height:fit-content}
.st.r{background:#000;color:#fff}
.q .tags{margin:8px 0}
.q textarea{min-height:56px}
.fl{display:flex;gap:6px;flex-wrap:wrap}
.fl button{border:1px solid #cfcfcf;border-radius:99px;padding:3px 11px;font-size:12px}
.fl button.on{background:#000;color:#fff;border-color:#000}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(14px);background:#fff;color:#000;padding:9px 16px;border-radius:3px;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:.2s;pointer-events:none;z-index:60;font-size:13px}
.toast.on{opacity:1;transform:translateX(-50%)}

/* mobile : colonne simple, plus de câbles */
body.m{background:linear-gradient(#000 0,#000 3%,#777 35%,#e8e8e8 70%,#fff 100%) fixed}
body.m #view{position:static;overflow:visible;padding:64px 14px 90px}
body.m #stage{width:auto!important;height:auto!important;background:none}
body.m #world{position:static;transform:none!important}
body.m #edges{display:none}
body.m .node{position:static;width:auto!important;margin:0 0 14px}
body.m .nh{cursor:default}
body.m .zoom{display:none}
body.m .pills{max-width:62vw}
body.m .bar small{display:none}
</style>
</head>

const DEPTS=[

   ["Briefs : « Brief Prod des 4 campagnes » et « Brief FILORGA film PEPTIDE 261105 »","Dans la note Evernote, non publiés ici",1]],
  todo:[],refs:[PLAN]},
 {id:"cam",name:"Caméra",known:[

   ["Plans principalement serrés, peu de mouvements à ce stade"],
   ["Utilisation possible du bras Neutron, comme sur LRP","À confirmer",1],
   ["1st AC : Lucas Bidard"],
   ["Effet filé sur film Peptide : optiquement filtres spécifiques ; FPS low fps"]],
  todo:["Camera body","Lenses","Special Equipment","Monitoring","Luts","Technical Specs"],
  refs:[{src:"refs/effet-file.jpg",title:"Réflexions & intuitions de DOP · effet filé sur film Peptide",cap:"Optiquement : filtres spécifiques. FPS : low fps."}]},
 {id:"lum",name:"Lumière",known:[

 {id:"photo",name:"Photo",known:[

const NODES=[
 {id:"root",kind:"Projet",x:520,y:60,w:520},

const KEY="filorga-2026-11:v3";
const blank=()=>({role:"",author:"",checks:{},custom:{},notes:{},qs:{},plan:{},camp:{},pos:{},z:0});

let saveT;const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},150)};

const fixedTodo=d=>d.todo.map((t,i)=>typeof t==="string"?{id:d.id+":"+i,text:t}:{id:d.id+":"+i,text:t.t,def:t.def,lines:t.lines,fix:t.fix,ctl:t.ctl});
const isDone=i=>(i.id in S.checks)?!!S.checks[i.id]:!!i.def;
const allTodo=d=>[...fixedTodo(d),...(S.custom[d.id]||[])];
const mobile=()=>innerWidth<820;

/* =========== Construction des nodes =========== */
const world=$("#world"),svg=$("#edges"),stage=$("#stage");
const el={};
function body(n){
 if(n.id==="root")return `<h2>Filorga<br>4 campagnes</h2>
  <p class="sub" style="margin-top:8px">Boner Boner · Director Eve Vitré · Photographe Ben Fourmi · DOP Seb Trân</p>
  <div class="facts"><div><span>Dates</span><b>Jeu. 19 + ven. 20 nov. 2026</b></div><div><span>Lieu</span><b>Studio de la Montjoie</b></div><div><span>Type</span><b>Pub – photo + vidéo, en binôme avec Ben Fourmi</b></div><div><span>Rythme</span><b>1 campagne par demi-journée (4)</b></div></div>
  <div class="cd"><strong id="days">—</strong><span class="sub" id="daysLabel"></span></div>`;
 if(n.id==="brief")return `<ul class="v">
  <li><b>Filorga : 4 campagnes, photo + vidéo, en binôme avec Ben Fourmi à la photo</b>
   <ul class="s"><li>1 campagne par demi-journée : REGEN PEPTIDE, UV CELLULAR, TIME FILLER, NCEF REVITALIZE</li><li>1 mannequin par campagne : plans d'attitude + application des produits</li></ul></li>
  <li><b>Plans principalement serrés, peu de mouvements, bras Neutron possible (comme sur LRP)</b></li>
  <li><b>1 plan machinerie spécial &gt; la caméra avance vers le talent qui marche vers la caméra. La caméra monte au-dessus du talent. Mouvement clean, robotique.... sans robot</b>
   <img class="rimg" data-zoom src="${MUGLER.src}" alt="Référence Mugler Angel Elixir"><span class="sub">Référence : Mugler Angel Elixir</span></li>
  <li>Plans produits seuls : IA ou 3D (non tournés)</li></ul>
  <p class="sub" style="margin:10px 0 0">Source : note de job Evernote, 13 nov.</p>`;
 if(n.id==="mood")return `<ol class="v"><li>mood B&amp;W : background dégradé Haut/ Bas, Noir/ blanc (pour 3 films, Regen Peptide, Time Filler, NCEF Revitalize)</li>
  <li>mood Incrust : background gris ou chroma key, TBD (film UV solaire), lumière solaire en keylight</li></ol>
  <p style="margin-top:10px">On peut tout shooter sur le fond cyclo blanc, et créer ce dégradé à la lumière, mais il va y avoir un bon travail de contrôle de lumière, avec du borniol en top, ajustable.</p>
  <img class="rimg" data-zoom src="refs/time-ncef-gradient.jpg" alt="Dégradé N&B de référence">`;
 if(n.camp){const c=n.camp;return `<h3>${esc(c.name)}</h3><p class="v">${esc(c.txt)}</p>
  ${c.pist?`<span class="tag k">${esc(c.pist)}</span>`:""}
  <div class="refs">${c.imgs.map(i=>`<img data-zoom src="${i[0]}" alt="${esc(i[1])}" loading="lazy">`).join("")}</div>
  <textarea data-camp="${c.id}" placeholder="Ma note sur cette campagne…" aria-label="Note ${esc(c.name)}" style="margin-top:10px">${esc(S.camp[c.id]||"")}</textarea>`;}
 if(n.id==="loc")return `<h3>Studio de la Montjoie</h3><p class="sub"><a href="https://studiosdelamontjoie.com" target="_blank" rel="noopener">studiosdelamontjoie.com</a></p>
  <div class="refs three"><img data-zoom src="refs/montjoie-1.jpg" alt="Studio de la Montjoie, plateau 480" loading="lazy"><img data-zoom src="refs/montjoie-2.jpg" alt="Studio de la Montjoie, plateau 480" loading="lazy"><img data-zoom src="${PLAN.src}" alt="Plan plateau 480" loading="lazy"></div>
  <p class="sub" style="margin:8px 0 0">Plateau 480 · <a href="${PLAN.link}" target="_blank" rel="noopener">${PLAN.linkText}</a></p>`;
 if(n.id==="plan")return `<p class="sub" style="margin-bottom:12px">Ordre des 4 campagnes : question ouverte. Teste un ordre, il reste sur ton appareil.</p>
  <div class="slots">${SLOTS.map((s,i)=>`<div><label>${esc(s)}</label><select data-slot="${i}"><option value="">À définir</option>${CAMPS.map(c=>`<option value="${c.id}"${S.plan[i]===c.id?" selected":""}>${esc(c.name)}</option>`).join("")}</select></div>`).join("")}</div>`;
 if(n.id==="hub")return `<h3>Chacun sa partie</h3><p class="sub" style="margin:2px 0 0">Ouvre ton département</p>`;
 if(n.dept){const d=n.dept,all=allTodo(d),done=all.filter(isDone).length;
  return `<h3>${esc(d.name)}</h3><div class="sub">${done} / ${all.length} points</div><div class="bardone"><i style="width:${all.length?done/all.length*100:0}%"></i></div>
  <ul>${d.known.slice(0,2).map(k=>`<li>${esc(k[0])}</li>`).join("")}</ul><span class="open">Ouvrir</span>`;}
 if(n.id==="team")return `<ul class="team">${TEAM.map(m=>`<li class="${m[1]?"":"tbc"}"><span>${esc(m[0])}</span><b style="font-weight:500">${m[1]?esc(m[1]):"à confirmer"}</b></li>`).join("")}</ul>
  <p class="sub" style="margin:10px 0 0">Téléphones et mails : dans la note Evernote, non publiés ici.</p>`;
 if(n.id==="qs"){const open=QS.filter(q=>!(S.qs[q.id]&&S.qs[q.id].done)).length;
  return `<div class="sub" style="margin-bottom:6px">${open} ouvertes sur ${QS.length}</div><ul class="ql">${QS.map(q=>{const r=S.qs[q.id]&&S.qs[q.id].done;return `<li data-openq="${q.id}"><i class="dot${r?" ok":""}"></i><span>${esc(q.t)}</span></li>`}).join("")}</ul>`;}
 if(n.id==="me")return `<p class="sub">Ce que tu écris ici reste <b>sur ton appareil</b>. Pour le partager, copie ou exporte tes notes et envoie-les à Seb.</p>
  <input type="text" id="author" placeholder="Ton nom" value="${esc(S.author)}" style="margin:8px 0 0">
  <div class="row"><button class="btn p" id="copy">Copier</button><button class="btn" id="export">Exporter</button><label class="btn">Importer<input type="file" id="import" accept="application/json" hidden></label><button class="btn" id="reset">Effacer</button></div>`;
 return "";
}
function refresh(id){const n=NODES.find(x=>x.id===id);el[id].querySelector(".nb").innerHTML=body(n);wire(el[id]);if(id==="root")countdown();if(id==="me")wireMe();requestAnimationFrame(drawEdges)}
function build(){
 NODES.forEach(n=>{
  const a=document.createElement("article");a.className="node "+(n.cls||"");a.id="n_"+n.id;a.style.width=n.w+"px";
  a.innerHTML=`<header class="nh"><span>${esc(n.kind)}</span></header><div class="nb">${body(n)}</div>`;
  world.appendChild(a);el[n.id]=a;
  place(n);drag(n,a);wire(a);
  if(n.dept)a.onclick=e=>{if(e.target.closest(".nh"))return;openDept(n.dept.id)};
 });
 countdown();wireMe();
}
const pos=n=>S.pos[n.id]||{x:n.x,y:n.y};
function place(n){const p=pos(n);el[n.id].style.left=p.x+"px";el[n.id].style.top=p.y+"px"}
function wire(root){
 root.querySelectorAll("[data-camp]").forEach(t=>t.oninput=()=>{S.camp[t.dataset.camp]=t.value;save()});
 root.querySelectorAll("[data-slot]").forEach(s=>s.onchange=()=>{S.plan[s.dataset.slot]=s.value;save()});
 root.querySelectorAll("[data-openq]").forEach(li=>li.onclick=()=>openQs(li.dataset.openq));
 root.querySelectorAll("textarea,select,input").forEach(i=>i.addEventListener("pointerdown",e=>e.stopPropagation()));
}
function countdown(){
 const d=Math.ceil((new Date(SHOOT_DATE+"T09:00:00")-new Date())/864e5),a=$("#days"),b=$("#daysLabel");if(!a)return;
 if(d>1){a.textContent="J-"+d;b.textContent="jours avant le tournage"}else if(d===1){a.textContent="J-1";b.textContent="demain"}else if(d===0){a.textContent="J";b.textContent="c'est aujourd'hui"}else{a.textContent="—";b.textContent="tournage passé ou en cours"}
}

/* =========== Glisser les nodes + câbles =========== */
let z=1;
function drag(n,a){
 a.querySelector(".nh").addEventListener("pointerdown",e=>{
  if(mobile()||e.button>0)return;e.preventDefault();
  const sx=e.clientX,sy=e.clientY,p0={...pos(n)};a.classList.add("drag");
  const mv=ev=>{S.pos[n.id]={x:Math.max(0,Math.round(p0.x+(ev.clientX-sx)/z)),y:Math.max(0,Math.round(p0.y+(ev.clientY-sy)/z))};place(n);drawEdges()};
  const up=()=>{window.removeEventListener("pointermove",mv);a.classList.remove("drag");save();fitStage()};
  window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up,{once:true});
 });
}
const rect=id=>{const n=NODES.find(x=>x.id===id),p=pos(n),e=el[id];return{x:p.x,y:p.y,w:e.offsetWidth,h:e.offsetHeight}};
function drawEdges(){
 if(mobile()){svg.innerHTML="";return}
 let out="";
 EDGES.forEach(([a,b])=>{
  const P=rect(a),C=rect(b);let x1,y1,x2,y2,path;
  if(C.y>=P.y+P.h-20){x1=P.x+P.w/2;y1=P.y+P.h;x2=C.x+C.w/2;y2=C.y;const m=(y2-y1)/2;path=`M${x1} ${y1}C${x1} ${y1+m} ${x2} ${y2-m} ${x2} ${y2}`}
  else if(C.x+C.w<=P.x){x1=P.x;y1=P.y+P.h/2;x2=C.x+C.w;y2=C.y+C.h/2;const m=(x1-x2)/2;path=`M${x1} ${y1}C${x1-m} ${y1} ${x2+m} ${y2} ${x2} ${y2}`}
  else if(C.x>=P.x+P.w){x1=P.x+P.w;y1=P.y+P.h/2;x2=C.x;y2=C.y+C.h/2;const m=(x2-x1)/2;path=`M${x1} ${y1}C${x1+m} ${y1} ${x2-m} ${y2} ${x2} ${y2}`}
  else{x1=P.x+P.w/2;y1=P.y;x2=C.x+C.w/2;y2=C.y+C.h;const m=(y1-y2)/2;path=`M${x1} ${y1}C${x1} ${y1-m} ${x2} ${y2+m} ${x2} ${y2}`}
  out+=`<path d="${path}" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="4" stroke-linecap="round"/><path d="${path}" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>`;
 });
 svg.innerHTML=out;
}
function worldH(){return Math.max(...NODES.map(n=>{const r=rect(n.id);return r.y+r.h}))+90}
function fitStage(){
 if(mobile()){stage.style.width=stage.style.height="";world.style.transform="";return}
 const W=Math.max(WORLD_W,...NODES.map(n=>{const r=rect(n.id);return r.x+r.w+40})),H=worldH();
 svg.setAttribute("width",W);svg.setAttribute("height",H);
 world.style.width=W+"px";world.style.height=H+"px";world.style.transform=`scale(${z})`;
 stage.style.width=W*z+"px";stage.style.height=H*z+"px";
}
function zoomTo(v){z=Math.min(1.4,Math.max(.4,v));S.z=z;save();fitStage()}
const fitZ=()=>Math.min(1,Math.max(.5,(innerWidth-20)/WORLD_W));
$("#zoom").onclick=e=>{const b=e.target.closest("[data-z]");if(!b)return;const k=b.dataset.z;
 if(k==="+")zoomTo(z+.1);else if(k==="-")zoomTo(z-.1);else if(k==="fit")zoomTo(fitZ());
 else if(confirm("Remettre tous les blocs à leur place d'origine ?")){S.pos={};NODES.forEach(place2);save();fitStage();drawEdges()}};
function place2(n){place(n)}

/* =========== Tiroir =========== */
const drawer=$("#drawer"),shade=$("#shade");
function openDrawer(html){drawer.innerHTML=html;drawer.classList.add("on");shade.classList.add("on");drawer.setAttribute("aria-hidden","false");drawer.scrollTop=0;drawer.querySelector("[data-close]").onclick=closeDrawer}
function closeDrawer(){drawer.classList.remove("on");shade.classList.remove("on");drawer.setAttribute("aria-hidden","true")}
shade.onclick=closeDrawer;addEventListener("keydown",e=>{if(e.key==="Escape"){closeLb();closeDrawer()}});
const lb=$("#lb");function closeLb(){lb.classList.remove("on")}
lb.onclick=closeLb;
document.addEventListener("click",e=>{const i=e.target.closest&&e.target.closest("img[data-zoom]");if(!i)return;e.stopPropagation();lb.querySelector("img").src=i.currentSrc||i.src;lb.classList.add("on")},true);
const head=t=>`<div class="dh"><h2>${esc(t)}</h2><button data-close aria-label="Fermer">×</button></div>`;

function openDept(id){
 const d=D(id);
 const det=it=>(it.lines||it.fix||it.ctl)?`<span class="det">${(it.lines||[]).map(l=>`<span>${esc(l)}</span>`).join("")}${it.fix?`<span><em>Fixtures :</em> ${esc(it.fix.join(" ; "))}</span>`:""}${it.ctl?`<span><em>Light Control :</em> ${esc(it.ctl.join(" ; "))}</span>`:""}</span>`:"";
 const item=(it,c)=>{const dn=isDone(it);return `<li class="${dn?"done":""}"><input type="checkbox" data-chk="${it.id}"${dn?" checked":""}><span><b class="t">${esc(it.text)}</b>${det(it)}</span>${c?`<button class="x" data-rm="${it.id}" aria-label="Supprimer">×</button>`:""}</li>`};
 const qs=QS.filter(q=>q.d.includes(id));
 openDrawer(head(d.name)+`
  <div class="ds"><h4>Ce qui est acté</h4><ul class="kn">${d.known.map(k=>`<li class="${k[2]?"w":""}">${esc(k[0])}${k[1]?`<small>${esc(k[1])}</small>`:""}</li>`).join("")}</ul></div>
  ${(d.refs||[]).map(r=>`<div class="ds"><h4>${esc(r.title)}</h4><img class="rimg" data-zoom src="${r.src}" alt="${esc(r.title)}">${r.cap?`<p class="sub" style="margin:8px 0 0">${esc(r.cap)}${r.link?` <a href="${r.link}" target="_blank" rel="noopener">${esc(r.linkText)}</a>`:""}</p>`:""}</div>`).join("")}
  <div class="ds"><h4>${d.todo.length?"À préparer":"Mes points à ajouter"}</h4><ul class="ck">${fixedTodo(d).map(i=>item(i,0)).join("")}${(S.custom[id]||[]).map(i=>item(i,1)).join("")}</ul>
   <form class="add" id="addForm"><input type="text" id="addText" placeholder="Ajouter un point…"><button class="btn" type="submit">Ajouter</button></form></div>
  <div class="ds"><h4>Questions liées</h4>${qs.length?`<ul>${qs.map(q=>`<li style="padding-left:0"><a href="#" data-gq="${q.id}">${esc(q.t)}</a><small>${S.qs[q.id]&&S.qs[q.id].done?"Résolu":"Ouvert"}</small></li>`).join("")}</ul>`:`<p class="sub">Aucune.</p>`}</div>
  <div class="ds"><h4>Mes notes ${esc(d.name)}</h4><textarea id="dnote" style="min-height:150px" placeholder="Besoins, remarques, matériel, contraintes…">${esc(S.notes[id]||"")}</textarea></div>`);
 drawer.querySelectorAll("[data-chk]").forEach(c=>c.onchange=()=>{S.checks[c.dataset.chk]=c.checked;c.closest("li").classList.toggle("done",c.checked);save();refresh("d_"+id)});
 drawer.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.custom[id]=(S.custom[id]||[]).filter(i=>i.id!==b.dataset.rm);save();refresh("d_"+id);openDept(id)});
 drawer.querySelectorAll("[data-gq]").forEach(a=>a.onclick=e=>{e.preventDefault();openQs(a.dataset.gq)});
 $("#addForm").onsubmit=e=>{e.preventDefault();const v=$("#addText").value.trim();if(!v)return;(S.custom[id]=S.custom[id]||[]).push({id:"x"+uid(),text:v});save();refresh("d_"+id);openDept(id)};
 $("#dnote").oninput=e=>{S.notes[id]=e.target.value;save()};
}
let qFilter="all";
function openQs(focus){
 const list=QS.filter(q=>qFilter==="all"||q.d.includes(qFilter));
 openDrawer(head("Questions ouvertes")+`<div class="ds"><div class="fl">${[["all","Toutes"],...DEPTS.map(d=>[d.id,d.name])].map(([i,n])=>`<button class="${qFilter===i?"on":""}" data-f="${i}">${esc(n)}</button>`).join("")}</div></div>
  <div class="ds">${list.map(q=>{const s=S.qs[q.id]||{};return `<div class="q${s.done?" done":""}" id="q_${q.id}"><header><h5>${esc(q.t)}</h5><button class="st${s.done?" r":""}" data-q="${q.id}">${s.done?"Résolu":"Ouvert"}</button></header>
   <div class="tags">${q.d.map(d=>`<span class="tag">${esc(D(d).name)}</span>`).join("")}</div>
   <textarea data-qa="${q.id}" placeholder="Réponse, décision, précision…">${esc(s.answer||"")}</textarea></div>`}).join("")}</div>`);
 drawer.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{qFilter=b.dataset.f;openQs()});
 drawer.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{const s=S.qs[b.dataset.q]=S.qs[b.dataset.q]||{};s.done=!s.done;save();refresh("qs");const y=drawer.scrollTop;openQs();drawer.scrollTop=y});
 drawer.querySelectorAll("[data-qa]").forEach(t=>t.oninput=()=>{(S.qs[t.dataset.qa]=S.qs[t.dataset.qa]||{}).answer=t.value;save()});
 if(focus){const q=document.getElementById("q_"+focus);if(q)q.scrollIntoView({block:"center"})}
}

/* =========== Rôle =========== */
function renderPills(){
 const p=$("#pills");p.innerHTML="";
 DEPTS.forEach(d=>{const b=document.createElement("button");b.className="pill"+(S.role===d.id?" on":"");b.textContent=d.name;
  b.onclick=()=>{S.role=S.role===d.id?"":d.id;save();renderPills();markRole();if(S.role){openDept(S.role)}};p.appendChild(b)});
}
function markRole(){DEPTS.forEach(d=>el["d_"+d.id].classList.toggle("me",S.role===d.id))}

/* =========== Notes : copier / export / import =========== */
function summary(){
 const L=["FILORGA — 4 campagnes — 19+20/11/2026"+(S.author?" — notes de "+S.author:"")];
 DEPTS.forEach(d=>{const items=allTodo(d).map(i=>`  [${isDone(i)?"x":" "}] ${i.text}`),note=(S.notes[d.id]||"").trim();
  L.push("","## "+d.name,...items);if(note)L.push("  Notes : "+note.replace(/\n/g,"\n  "))});
 const camps=CAMPS.filter(c=>(S.camp[c.id]||"").trim()).map(c=>`  ${c.name} : ${S.camp[c.id].trim()}`);if(camps.length)L.push("","## Campagnes",...camps);
 const plan=SLOTS.map((s,i)=>S.plan[i]?`  ${s} : ${CAMPS.find(c=>c.id===S.plan[i]).name}`:null).filter(Boolean);if(plan.length)L.push("","## Ordre testé",...plan);
 const qs=QS.filter(q=>S.qs[q.id]&&(S.qs[q.id].answer||S.qs[q.id].done)).map(q=>`  ${S.qs[q.id].done?"[résolu]":"[ouvert]"} ${q.t}${S.qs[q.id].answer?"\n    → "+S.qs[q.id].answer.trim():""}`);if(qs.length)L.push("","## Questions",...qs);
 return L.join("\n");
}
function wireMe(){
 const g=id=>document.getElementById(id);if(!g("copy"))return;
 g("author").oninput=e=>{S.author=e.target.value;save()};
 g("copy").onclick=async()=>{try{await navigator.clipboard.writeText(summary());toast("Notes copiées")}catch(e){const w=window.open("","_blank");if(w)w.document.write("<pre>"+esc(summary())+"</pre>")}};
 g("export").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="filorga-"+(S.author||"notes").toLowerCase().replace(/\W+/g,"-")+".json";a.click();URL.revokeObjectURL(a.href);toast("Export prêt")};
 g("import").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{
   const o=JSON.parse(r.result),who=o.author||"import",add=(a,t)=>t&&t!==a?((a||"")+`\n— ${who} —\n${t}`).trim():a;
   Object.entries(o.checks||{}).forEach(([k,v])=>{if(v)S.checks[k]=true});
   Object.entries(o.custom||{}).forEach(([d,a])=>{S.custom[d]=S.custom[d]||[];a.forEach(i=>{if(!S.custom[d].some(x=>x.id===i.id))S.custom[d].push(i)})});
   Object.entries(o.notes||{}).forEach(([d,t])=>{S.notes[d]=add(S.notes[d],t)});
   Object.entries(o.camp||{}).forEach(([d,t])=>{S.camp[d]=add(S.camp[d],t)});
   Object.entries(o.qs||{}).forEach(([q,v])=>{const s=S.qs[q]=S.qs[q]||{};if(v.done)s.done=true;s.answer=add(s.answer,v.answer)});
   save();NODES.forEach(n=>{if(n.id!=="me")refresh(n.id)});toast("Import fusionné")}catch(err){toast("Fichier non lisible")}};r.readAsText(f);e.target.value=""};
 g("reset").onclick=()=>{if(confirm("Effacer toutes tes notes et coches sur cet appareil ?")){S=blank();try{localStorage.removeItem(KEY)}catch(e){}NODES.forEach(n=>{place(n);refresh(n.id)});renderPills();markRole();zoomTo(fitZ());toast("Effacé")}};
}

/* =========== Démarrage =========== */
function layoutMode(){document.body.classList.toggle("m",mobile());fitStage();drawEdges()}
build();renderPills();markRole();
z=S.z||fitZ();layoutMode();
addEventListener("resize",layoutMode);
if(window.ResizeObserver){const ro=new ResizeObserver(()=>{fitStage();drawEdges()});Object.values(el).forEach(e=>ro.observe(e))}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fitStage();drawEdges()});
</script>
</body>
</html>
