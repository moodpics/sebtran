<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projets · Seb Trân</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html{min-height:100%;background:#000}
body{min-height:100vh;font-family:"Hanken Grotesk",system-ui,sans-serif;color:#111;background:linear-gradient(180deg,#000 0%,#2a2a2a 35%,#9a9a9a 100%) fixed;-webkit-font-smoothing:antialiased}
header{padding:28px clamp(20px,5vw,64px);color:#fff;display:flex;justify-content:space-between;align-items:baseline;gap:16px}
header b{font-weight:600;font-size:15px;letter-spacing:.01em}
header small{font-size:13px;opacity:.6}
main{max-width:980px;margin:0 auto;padding:clamp(24px,6vw,72px) clamp(20px,5vw,64px) 96px}
h1{color:#fff;font-weight:300;font-size:clamp(34px,6vw,64px);letter-spacing:-.02em;line-height:1.05}
.lead{color:#fff;opacity:.62;margin-top:14px;font-size:16px;max-width:52ch}
.grid{display:grid;gap:18px;margin-top:44px}
.card{display:block;background:#fff;border-radius:14px;padding:26px 28px 24px;color:inherit;text-decoration:none;box-shadow:0 10px 34px rgba(0,0,0,.28);transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 44px rgba(0,0,0,.36)}
.card:focus-visible{outline:3px solid #6fb1ff;outline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6b6b6b}
.tag{display:inline-flex;align-items:center;gap:7px}
.tag i{width:8px;height:8px;border-radius:50%;background:#bbb}
.tag.next i{background:#e5484d}
.card h2{font-weight:600;font-size:clamp(30px,5vw,46px);letter-spacing:-.02em;margin:14px 0 4px}
.sub{font-size:17px;color:#333}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:18px;padding-top:16px;border-top:1px solid #e6e6e6;font-size:14px;color:#555}
.meta b{font-weight:500;color:#111}
.go{margin-left:auto;font-weight:500;color:#111}
footer{color:#fff;opacity:.45;font-size:12px;margin-top:40px}
</style>
</head>
<body>
<header><b>Seb Trân</b><small>Projets · lecture seule</small></header>
<main>
<h1>Projets</h1>
<p class="lead">Une page par projet : brief, équipe, références et déclinaison par département.</p>
<div class="grid" id="list" aria-live="polite"></div>
<footer id="foot"></footer>
</main>
<script>
/* Pour ajouter un projet : une ligne ici, avec le nom du dossier dans projets/ et, en secours, un titre. */
const PROJECTS=[
 {dir:"armani",fallback:{title:"Armani",sub:"Mardi 8 + mercredi 9 décembre 2026",shoot:"2026-12-08"}},
 {dir:"filorga",fallback:{title:"Filorga",sub:"Jeudi 19 + vendredi 20 novembre 2026",shoot:"2026-11-19"}}
];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=iso=>{try{return new Date(iso).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).replace(" à "," · ")}catch(e){return""}};
async function load(p){
 try{const r=await fetch(p.dir+"/data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;return {p,d:await r.json()}}
 catch(e){return {p,d:null}}
}
function card({p,d}){
 const f=p.fallback,root=(d&&d.root)||{},title=root.title||f.title,sub=root.sub||f.sub,shoot=(d&&d.shootDate)||f.shoot;
 const crew=root.crew||[],get=k=>{const x=crew.find(c=>c[0]===k);return x&&x[1]};
 const prod=get("Production"),real=get("Réalisateur")||get("Co-réalisation");
 const days=Math.ceil((new Date(shoot+"T23:59:59")-new Date())/864e5);
 const next=days>=0;
 const meta=[prod&&`<span>Production <b>${esc(prod)}</b></span>`,real&&`<span>Réalisation <b>${esc(real)}</b></span>`,
  (d&&d.updated)&&`<span>Mis à jour <b>${esc(fmt(d.updated))}</b></span>`].filter(Boolean).join("");
 return `<a class="card" href="${esc(p.dir)}/"><div class="top"><span class="tag ${next?"next":""}"><i></i>${next?"À venir":"Terminé"}</span><span>${next&&days>0?"J-"+days:next?"Aujourd'hui":""}</span></div>
 <h2>${esc(title)}</h2><div class="sub">${esc(sub)}</div>
 <div class="meta">${meta}<span class="go">Ouvrir ›</span></div></a>`;
}
(async()=>{
 const res=await Promise.all(PROJECTS.map(load));
 const key=({p,d})=>{const s=(d&&d.shootDate)||p.fallback.shoot;const t=new Date(s+"T23:59:59")-new Date();return t>=0?[0,t]:[1,-t]};
 res.sort((a,b)=>{const x=key(a),y=key(b);return x[0]-y[0]||x[1]-y[1]});
 document.getElementById("list").innerHTML=res.map(card).join("");
})();
</script>
</body>
</html>
