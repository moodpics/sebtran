# OPTIONNEL. Filet de sécurité pour les modifs faites hors Claude (ex. édition directe sur github.com).
# Sans le secret CINE_REPO_TOKEN, ce workflow ne fait rien (il ne plante pas).
# Le flux normal : Claude modifie sebtran puis lance scripts/sync-cinematographer.sh.
name: Sync sebastien-tran.com

on:
  push:
    branches: [main]
    paths-ignore: ["projets/**"]
  workflow_dispatch: {}

concurrency:
  group: sync-cinematographer
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Jeton présent ?
        id: chk
        env:
          T: ${{ secrets.CINE_REPO_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "Pas de CINE_REPO_TOKEN : synchro automatique désactivée."; echo "on=false" >> "$GITHUB_OUTPUT"; else echo "on=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.chk.outputs.on == 'true'
        uses: actions/checkout@v4

      - if: steps.chk.outputs.on == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Générer la version cinématographie
        if: steps.chk.outputs.on == 'true'
        run: node scripts/build-cinematographer.mjs dist-cine

      - name: Récupérer le dépôt du domaine
        if: steps.chk.outputs.on == 'true'
        uses: actions/checkout@v4
        with:
          repository: moodpics/sebtran-CinematographerOnly
          token: ${{ secrets.CINE_REPO_TOKEN }}
          path: target

      - name: Copier et pousser si changement
        if: steps.chk.outputs.on == 'true'
        run: |
          rsync -a --delete --exclude='.git' dist-cine/ target/
          cd target
          git config user.name "sebtran-sync"
          git config user.email "sebtran-sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à synchroniser."
          else
            git commit -m "Sync depuis moodpics/sebtran@${GITHUB_SHA::7}"
            git push
          fi
