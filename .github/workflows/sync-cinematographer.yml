# À chaque push sur main de ce dépôt (sebtran), régénère la version « Cinematography seule »
# et la publie sur moodpics/sebtran-CinematographerOnly (= sebastien-tran.com).
name: Sync sebastien-tran.com

on:
  push:
    branches: [main]
    paths-ignore: ["projets/**"]
  workflow_dispatch: {}

concurrency:
  group: sync-cinematographer
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Générer la version cinématographie
        run: node scripts/build-cinematographer.mjs dist-cine

      - name: Récupérer le dépôt du domaine
        uses: actions/checkout@v4
        with:
          repository: moodpics/sebtran-CinematographerOnly
          token: ${{ secrets.CINE_REPO_TOKEN }}
          path: target

      - name: Copier et pousser si changement
        run: |
          rsync -a --delete --exclude='.git' dist-cine/ target/
          cd target
          git config user.name "sebtran-sync"
          git config user.email "sebtran-sync@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à synchroniser."
          else
            git commit -m "Sync depuis moodpics/sebtran@${GITHUB_SHA::7}"
            git push
          fi
